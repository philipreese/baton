[workspace]
channels = ["conda-forge"]
name = "baton"
# win-64 is the only support target (#1405, Windows-only). linux-64 stays solely as a dev-sandbox
# accommodation -- Claude Code cloud sessions doing development work here -- not a support target.
platforms = ["win-64", "linux-64"]
version = "0.1.0"

# Disable MSBuild out-of-process node reuse. With reuse on (the default), a build leaves persistent
# worker nodes alive to be reused by the NEXT build, shared across all worktrees for the user. Two
# builds running at once — e.g. a self-dispatched worker running `pixi run gates` in one worktree
# while another build runs in a sibling worktree — then race over that shared node pool: one recycles
# a node the other is mid-pipe with, the pipe breaks (`System.IO.IOException: Pipe is broken`), and
# MSBuild reports `MSB4166: Child node exited prematurely`, killing the whole build. Set here in the
# activation env (not a shell) so EVERY `pixi run` build inherits it, including a dispatched worker's
# self-gate, which is the case that needs it. Cost is a small per-build startup penalty; the win is
# that concurrent worktree builds each own throwaway nodes and cannot collide.
#
# #1671: also disable Roslyn's shared VBCSCompiler.exe server -- same activation-env scope as
# MSBUILDDISABLENODEREUSE above, same reason (a memory-bound box, one fewer long-lived process per
# machine). Why this scope and not a Directory.Build.props condition, and what it costs: spec/baton.md
# §11 C-13.
[activation.env]
MSBUILDDISABLENODEREUSE = "1"
UseSharedCompilation = "false"

[tasks]
# Every toolchain below (Go, .NET) is installed separately and is NOT
# pixi-managed. CLAUDE.md's "Running tasks" section owns that fact and the install instructions;
# stated here once rather than re-explained per task.
#
# Every `dotnet` invocation that starts MSBuild goes through tools/buildlock.py (#1402): a
# host-global lock serializing builds across worktrees, so concurrent lanes queue at the build
# instead of the whole-lane level. The wrapper's docstring owns the mechanism (OS-released region
# lock, nesting marker, loud timeout); its selftest is gated (buildlock-selftest below). `dotnet
# run` tasks count as MSBuild owners too (implicit build) -- `tokens` and `vendor-check` are
# wrapped for that reason. Not wrapped: `dotnet tool restore`/`dotnet reportgenerator`/`dotnet tool install` legs
# (tool-manifest and standalone-tool commands, not MSBuild), the LIVE smoke-*/vendor-probe tasks
# (human-run, never concurrent with a lane by construction), and
# `gates`/`gates-fast` themselves -- they hold no MSBuild directly; their MSBuild-owning legs
# (fmt-check, lint, test-no-build) are each wrapped, which serializes exactly the dangerous
# fraction and lets the python audit legs of two gates runs still overlap.
build = { cmd = "python tools/buildlock.py dotnet build" }
# The rebuild is FORCED and then the test run is told not to build again (#688). MSBuild skips a
# project whose source is older than the assembly built from it, so a plain `dotnet test` can run the
# suite against an assembly that does not correspond to the checkout -- every assertion passing or
# failing according to code that is not there, with nothing printed and nothing to distinguish it
# from a correct run. #687 was the loud half of the same mechanism, on `lint`.
#
# Reachable rather than theoretical, and by following this repo's own discipline: mutation testing
# edits a source, builds, runs, and restores -- and the restored file can predate the mutant's
# output. The trap is that the arm you TRUST is the final green one, which is exactly the run that
# can be reading the mutant's build.
#
# `dotnet test --no-incremental` does not exist -- MSBuild answers `MSB1001: Unknown switch` -- so
# the force has to be a separate build step, and `--no-build` is what stops the second one undoing
# it. MEASURED on this machine: 66s incremental after touching one file, 85s this way (19s build +
# 66s test), so about +19s or 29% per run. Paid on every iteration deliberately: `pixi run gates`
# already forced a rebuild via `lint`, so the protection existed where the risk was lowest and was
# absent from the inner loop, where a session runs this dozens of times.
# #1833: `dotnet test` runs on Microsoft.Testing.Platform (MTP) now (root `global.json`), not
# VSTest -- xunit.v3 4.0.0 requires it on the .NET 10 SDK. Why the bump closes #984 at its source:
# spec/baton.md §11 C-17. `--minimum-expected-tests 1` on every leg below is the zero-test-leg guard
# `tools/buildlock.py`'s docstring names as a known silent-failure mode: MTP already refuses a
# filtered assembly that matches zero tests (exit 8) UNLESS the whole invocation is unfiltered, in
# which case a leg that somehow ran no tests at all would otherwise exit 0 -- this flag turns that
# into exit 9, a hard failure, at the cost of nothing when the leg is healthy. Bare `dotnet test`
# (no `--solution`) resolves the one `.slnx` in the cwd the same way VSTest's did.
test = { cmd = "python tools/buildlock.py dotnet build --no-incremental && python tools/buildlock.py dotnet test --no-build --minimum-expected-tests 1" }
# Sharded test tasks for CI (#1363) — see .github/workflows/ci.yml
#
# #1833: no longer `--filter` (VSTest syntax `dotnet test` no longer parses under MTP for xUnit --
# it needs xunit's own `--filter-namespace` et al., MEASURED to still exit 8 per zero-matched
# assembly even inside an aggregate `--minimum-expected-tests`-guarded solution run, which is
# exactly the "zero-match assembly fails the leg" breakage #984's findings comment named). Each
# shard instead invokes its member projects directly by `--project` -- there is no filter for a
# zero-match assembly to hit, because every project actually named here has tests of its own.
# `Baton.Tests` is the flow suite; the other four in-solution test projects (everything except
# `Baton.Tests`) are `test-other`'s split, unchanged from the pre-#1833 grouping. `Baton.Cli.
# SmokeTests` stays out of both, same as always (outside `Baton.slnx`, live-only).
test-flow = { cmd = "python tools/buildlock.py dotnet build --no-incremental && python tools/buildlock.py dotnet test --project tests/Baton.Tests/Baton.Tests.csproj --no-build --minimum-expected-tests 1" }
test-other = { cmd = "python tools/buildlock.py dotnet build --no-incremental && python tools/buildlock.py dotnet test --project tests/Baton.Vendors.Tests/Baton.Vendors.Tests.csproj --no-build --minimum-expected-tests 1 && python tools/buildlock.py dotnet test --project tests/Baton.Architecture.Tests/Baton.Architecture.Tests.csproj --no-build --minimum-expected-tests 1 && python tools/buildlock.py dotnet test --project tests/Baton.Cli.Tests/Baton.Cli.Tests.csproj --no-build --minimum-expected-tests 1 && python tools/buildlock.py dotnet test --project tests/Baton.VendorProbe.Tests/Baton.VendorProbe.Tests.csproj --no-build --minimum-expected-tests 1" }
# The gates-only test leg (#986): `gates` sequences this after `lint`, whose forced
# `--no-incremental` build is the same protection `test`'s own build step buys (the "partial
# cover" note under `lint` below) -- so building again inside the same run was pure duplication.
# Standalone use is EXPOSED to the #688 stale-assembly trap `test` exists to close: outside a
# gates run, use `pixi run test`.
#
# #1833: `-m:1` (an MSBuild switch, #1671) no longer serializes anything under MTP -- MEASURED
# forwarding it to each test module as an unrecognised argument, which made every module report
# "Zero tests ran" (exit 5, invalid command line) rather than actually running serialized. MTP's own
# equivalent is `--max-parallel-test-modules 1`, MEASURED to serialize the five xUnit test projects'
# testhost processes exactly as `-m:1` did (run durations summed rather than overlapped, same shape
# spec/baton.md §11 C-13 measured for the VSTest-era knob); in-assembly parallelism is still
# untouched. `--minimum-expected-tests 1` joins it for the same zero-test-leg guard `test` above
# carries.
test-no-build = { cmd = "python tools/buildlock.py dotnet test --no-build --max-parallel-test-modules 1 --minimum-expected-tests 1" }
# Coverage report (#199): collects per-test-project Cobertura via Microsoft.Testing.Extensions.
# CodeCoverage (MTP's own coverage extension, #1833 -- coverlet.collector was a VSTest data
# collector with no MTP equivalent; Microsoft's extension was picked over the coverlet.MTP
# alternative because it needed no second package swap beyond what the xunit v3 4.0 bump already
# required), merges into an HTML report + text summary at artifacts/coverage/report/ (open
# index.html, or read Summary.txt). Results are wiped first so stale collections never skew the
# merge. reportgenerator's own input glob is unchanged in shape (still *.cobertura.xml under
# artifacts/coverage) -- only MTP's flat `<guid>.cobertura.xml` naming (no per-project
# subdirectory) changed the exact pattern. #1474 folded the last non-.NET code (aer-core's Rust)
# into a managed port, so this coverage report is now the whole engine, not a partial one.
#
# `coverage.settings.xml` restores the source-generated-code exclusions; spec/baton.md records the
# measured evidence and the earlier command-line-validation discrepancy (#1846).
coverage = { cmd = "rm -rf artifacts/coverage && dotnet tool restore && python tools/buildlock.py dotnet test --coverage --coverage-settings coverage.settings.xml --coverage-output-format cobertura --results-directory artifacts/coverage --minimum-expected-tests 1 && dotnet reportgenerator -reports:artifacts/coverage/*.cobertura.xml -targetdir:artifacts/coverage/report \"-reporttypes:Html;TextSummary\" \"-assemblyfilters:+Baton.*\"" }

fmt = "python tools/buildlock.py dotnet format"
fmt-check = { cmd = "python tools/buildlock.py dotnet format --verify-no-changes" }

# --no-incremental is load-bearing, not a purity knob (#687). MSBuild decides a project is up to date
# by comparing timestamps, so a source file OLDER than the assembly built from it is silently skipped
# and `dotnet build -warnaserror` prints "Build succeeded. 0 Error(s)" for code that does not compile.
# Measured: this reported success locally on the exact tree CI then rejected with CS8604, on both
# platforms. Mutation testing is what puts a tree in that state, and the v-and-v gate calls for it on
# every behaviour change -- edit, build the mutant, restore the original, and the restored file can
# predate the mutant's output. CI never sees it because a fresh checkout has nothing to skip, which is
# exactly why the local gate has to be the honest one. ~10s on this solution; a gate that can certify
# a non-compiling tree is worth nothing at any speed.
#
# Partial cover for `test` too, when run through `gates`: lint precedes it and forces the rebuild, so
# the suite then runs against fresh assemblies. `pixi run test` on its own is still exposed.
lint = { cmd = "python tools/buildlock.py dotnet build -warnaserror --no-incremental" }

# M13 Phase 1 (#107): packs Baton.Cli as an installable global dotnet tool (nupkg) -- pure managed
# code since #1474, no native library to embed. Not part of `build`/`test`/`lint` — packing isn't
# needed for everyday development, only for the install round trip this phase's runbook-style
# verification exercises (`dotnet tool install --global --add-source bin/pack <PackageId>`).
pack = { cmd = "python tools/buildlock.py dotnet pack src/Baton.Cli/Baton.Cli.csproj -o bin/pack" }

# Validates what a live smoke run ASSUMES, before it is allowed to spend anything. Free: reads
# files and queries `agy models` / `claude auth status`, and starts no billable session. Every
# smoke-* task depends on it, so a stale assumption stops the run instead of being paid for.
#
# It exists because `gemini-3-flash` -- a model agy does not have -- sat in a binding fixture, two
# dialogue participants and two runbooks while enforcing nothing: claude REJECTS an unknown --model
# and self-reports, agy ACCEPTS it and silently runs its own default. Two smoke tests were therefore
# running on whatever agy defaulted to while the repo read as if a cheap model was pinned. The gate
# prints what it CANNOT check as well as what it did, so passing it is never read as "all clear".
smoke-preflight = { cmd = "python -u tools/smoke-preflight/preflight.py" }

# LIVE AND PAID -- smoke-claude, smoke-mixed-vendor, vendor-probe and
# vendor-verify drive real authenticated vendor CLIs and spend real subscription usage. They never
# run in CI and are permanently a human action item; an agent session cannot close one. CLAUDE.md's
# "Live-vendor smoke tests" section owns that rule and the reasoning; each task below adds only what
# is specific to IT, and names the runbook to read first. `Baton.Cli.SmokeTests` sits outside
# Baton.slnx so none of it runs as a side effect of `build`/`test`/`lint`.
#
# Not in that set, despite the neighbouring names: smoke-preflight, vendor-survey and vendor-check
# are all free and start no billable session -- each says so where it is defined.
#
# M11 Phase 4 (#87), the milestone's completion gate: a real draft → review workflow through
# `baton run` against `claude`, never `pixi run test`'s stub/shell-stub path.
# docs/runbooks/live-claude-smoke.md
# #1833: the smoke project moved to MTP with the rest (root `global.json` applies to every `dotnet
# test`), so these three use `--project` and xunit's own `--filter-class` -- VSTest's positional
# project path and `--filter FullyQualifiedName~…` no longer parse here (review finding on #1843).
smoke-claude = { cmd = "dotnet test --project tests/Baton.Cli.SmokeTests/Baton.Cli.SmokeTests.csproj --minimum-expected-tests 1", depends-on = ["smoke-preflight"] }

# #649's completion gate: a withheld-write worker writes its declared output into BATON_OUTPUT_DIR and
# leaves its workspace empty. Three mechanisms have to compose; unit tests cover each part and only a
# live run covers the composition. docs/runbooks/live-claude-smoke.md
smoke-readonly = { cmd = "dotnet test --project tests/Baton.Cli.SmokeTests/Baton.Cli.SmokeTests.csproj --filter-class Baton.Cli.SmokeTests.LiveReadOnlyReviewerSmokeTest --minimum-expected-tests 1", depends-on = ["smoke-preflight"] }

# M12 Phase 4 (#98), this milestone's completion gate: a real draft (`claude`) → review (`agy`)
# workflow, paused at review's declared PausePoint and resumed via `baton decide`. Needs BOTH vendors.
# docs/runbooks/live-mixed-vendor-smoke.md
smoke-mixed-vendor = { cmd = "dotnet test --project tests/Baton.Cli.SmokeTests/Baton.Cli.SmokeTests.csproj --filter-class Baton.Cli.SmokeTests.LiveMixedVendorPausedRunSmokeTest --minimum-expected-tests 1", depends-on = ["smoke-preflight"] }

# Vendor probe (#504): establishes what each vendor CLI can actually do, and writes both the
# findings matrix and docs/vendor-probe.lock.json (the versions those findings were established
# against). Live and paid, per the block above smoke-claude. It exists because
# docs/vendor-capabilities.md always said "re-run the probes after a vendor update" while the probes
# were ad-hoc shell, written once and thrown away; several rows were wrong as a result, most
# expensively `--permission-prompt-tool`, which decision 0015 inverted its whole mechanism on.
# See docs/runbooks/vendor-probe.md.
vendor-probe = { cmd = "dotnet run --project tools/Baton.VendorProbe -- --out docs/vendor-capabilities.probe.json" }

# Vendor documentation survey (#527): the reading half of the same problem. `vendor-probe` above
# measures the binaries; this mirrors both vendors' published documentation and harvests the
# sentences that actually change decisions. Unlike vendor-probe it is safe anywhere — it only
# fetches public docs, drives no CLI, and spends no subscription usage.
#
# Both vendors publish a machine-readable index (claude: llms.txt with raw .md per page; agy:
# llms.txt + sitemap.xml, server-rendered). Reading ~250 pages by hand isn't repeatable, and a
# summarizing fetch is lossy — that produced the first, wrong reading of claude's `defer`. Every
# finding that changed a decision was one sentence sharing a recognisable grammar ("Bare mode skips
# OAuth and keychain reads"), so this harvests that class corpus-wide: 100% page coverage at ~1% of
# the bytes; docs/vendor-coverage.md holds each page's disposition, so coverage stays checkable, not asserted.
#
# Re-run on every vendor version bump — VendorProbeStalenessTests already fails when a CLI moves.
vendor-survey = { cmd = "python tools/vendor-survey/vendor_survey.py" }

# Vendor behaviour verification (#527): the third leg. vendor-survey reads what the vendors *say*;
# this runs what they *do*. Every check here is a behaviour an AER design decision rests on, and the
# audit that produced them found four vendor statements to be wrong and two that contradicted each
# other — so a doc page changing is a reason to re-run this, not a reason to trust the new page.
#
# Live and paid, per the block above smoke-claude. Checks that would touch the operator's own
# ~/.claude or ~/.gemini are skipped unless --allow-config-writes is passed.
#
# The rules every check here is built on are in tools/vendor-verify/README.md § "The three rules",
# not restated here -- an inline list goes stale the next time one is added.
#
# A full run is long -- every arm is a real CLI session -- so run it per group and unbuffered:
#   pixi run vendor-verify -- --only gate
# `-u` is baked in: without it Python holds print output in a block buffer when stdout is
# redirected, and a run killed on a timeout loses everything it had already found.
vendor-verify = { cmd = "python -u tools/vendor-verify/verify.py" }

# Recomputes the #527 audit's completeness register: for each step of the chain, the population that
# was supposed to be covered and whether every member of it carries a disposition. Exists because
# "we read everything" is unfalsifiable -- a completeness claim ships with the artifact that lets
# someone check it. Free: reads files, starts no session.
# It also prints what it CANNOT check, since a completeness checker that hides its own blind spots
# is precisely the failure it exists to prevent.
#
# STANDING CHECK (re-scoped 2026-07-26 -- see the SCOPE note in the script; it was run cold nine
# days after #527 and caught 11 undispositioned decisions and 2 orphaned vendor-verify checks).
# Run it before the PRs CLAUDE.md gate `record-once` names. Free except step 4 (closed-issue
# citation check), which needs `gh` and the network and skips loudly rather than failing when
# neither is available.
audit-completeness = { cmd = "python -u tools/audit-completeness/completeness.py" }

# #1759: `build-cli` used to exist so the CI audit leg had a built Baton.Cli before
# audit-selfcheck's catalog checks read the role catalog through `tools/baton-agy-loop/dispatch.py`'s
# own `baton templates --json` call at import. That reason went away with dispatch.py; neither
# audit-selfcheck nor audit-controls touches the built CLI at all now, so the task was removed
# rather than left as dead weight. They stay sequenced in AFTER_BUILD_FAST (tools/gates/gates.py)
# regardless, out of caution rather than a remaining need -- moving them into OVERLAP is now
# possible but is its own change, not exercised by this one.
audit-selfcheck = { cmd = "python -u tools/audit-completeness/selfcheck.py" }
audit-controls = { cmd = "python -u tools/audit-completeness/controls.py" }

# Needs full history: it diffs against origin/main. See recordonce.py (#671).
audit-recordonce = { cmd = "python -u tools/audit-completeness/recordonce.py" }

# #636: mechanized staleness checks over GitHub-hosted facts (open issue citing a closed one as
# unresolved; a doc's "not wired into CI" claim contradicted by ci.yml). DELIBERATELY UNWIRED --
# reads live `gh` data and reports findings for a human to triage, never fails the run. See the
# module docstring for why this stays a report rather than a gate.
audit-staleness-ext = { cmd = "python -u tools/audit-completeness/staleness_ext.py" }
# The synthetic-fixture half of the same file -- proves the matching logic discriminates, with no
# live data and so no backlog-debt exposure. This is the half safe to gate; see gates.py.
audit-staleness-ext-selftest = { cmd = "python -u tools/audit-completeness/staleness_ext.py --selftest" }

# #910: wait-ceiling checker for fixed sub-60s wait ceilings in tests.
audit-waitceiling = { cmd = "python -u tools/audit-completeness/waitceiling.py" }
audit-waitceiling-selftest = { cmd = "python -u tools/audit-completeness/waitceiling.py --selftest" }

# #1242 / decision 0055: phrases a decision record has RETIRED — the previous name of a renamed
# object, stale by definition, so the check has no false positives to triage. Not a vocabulary lint:
# telling authority-"grant" from permission-"grant" needs the sentence's meaning, which is why 0055
# bans only the phrase that has no legitimate remaining use.
audit-retiredphrases = { cmd = "python -u tools/audit-completeness/retiredphrases.py" }
audit-retiredphrases-selftest = { cmd = "python -u tools/audit-completeness/retiredphrases.py --selftest" }

# #1428: see speccitations.py's own docstring for what it enforces.
audit-speccitations = { cmd = "python -u tools/audit-completeness/speccitations.py" }
audit-speccitations-selftest = { cmd = "python -u tools/audit-completeness/speccitations.py --selftest" }

# #1430: see commentspecrefs.py's own docstring for what it enforces on § refs in code comments.
audit-commentspecrefs = { cmd = "python -u tools/audit-completeness/commentspecrefs.py" }
audit-commentspecrefs-selftest = { cmd = "python -u tools/audit-completeness/commentspecrefs.py --selftest" }

# #1397: the docs-budget tripwire -- see docsbudget.py's own docstring for what it enforces.
audit-docsbudget = { cmd = "python -u tools/audit-completeness/docsbudget.py" }
audit-docsbudget-selftest = { cmd = "python -u tools/audit-completeness/docsbudget.py --selftest" }

# #1400: invoking-baton.md's command lines vs the CLI parsers' own usage strings -- see
# clitripwire.py's own docstring for the bidirectional contract it enforces.
audit-clitripwire = { cmd = "python -u tools/audit-completeness/clitripwire.py" }
audit-clitripwire-selftest = { cmd = "python -u tools/audit-completeness/clitripwire.py --selftest" }

# #1402: proves the build lock discriminates -- two wrapped commands serialize, a dead holder's
# lock is released by the OS, and a blocked waiter times out loudly. Real subprocesses against an
# isolated lock file; never touches the real one, so it is safe to overlap with anything.
buildlock-selftest = { cmd = "python -u tools/buildlock.py --selftest" }

# #1206: the flake-watch reporter's control arm. The reporter itself only ever runs in the scheduled
# flake-watch workflow, which is exactly why its selftest belongs in the local gates — a reporter that
# has quietly stopped being able to report is indistinguishable, from the outside, from a quiet suite.
flake-watch-selftest = { cmd = "python -u tools/flake-watch/summarize.py --selftest" }
diff-shape = { cmd = "python -u tools/diff-shape/diff_shape.py" }
diff-shape-selftest = { cmd = "python -u tools/diff-shape/diff_shape.py --selftest" }

deepswe-derived-check = { cmd = "python -u benchmarks/deepswe/derive_scores.py --check-all" }
deepswe-derived-check-selftest = { cmd = "python -u benchmarks/deepswe/derive_scores.py --selftest" }

# Every local gate, one exit code. Report THIS command's exit status, never a per-gate line scraped
# out of the combined output -- see tools/gates/gates.py for the two occasions that went wrong.
gates = { cmd = "python -u tools/gates/gates.py" }
gates-fast = { cmd = "python -u tools/gates/gates.py --fast" }
# The quiet pair (#1560) is what DISPATCHED WORKERS run: same gates, same exit-code contract, but a
# passing gate's log is dropped and a failing gate's is tail-bounded -- inherited full-suite output
# was measured re-entering a lane's model context on every call (43.8M cache-read tokens in one lane).
gates-quiet = { cmd = "python -u tools/gates/gates.py --quiet" }
gates-fast-quiet = { cmd = "python -u tools/gates/gates.py --fast --quiet" }
gates-selftest = { cmd = "python -u tools/gates/gates.py --selftest" }
# #1910: the completion pass a lane runs before pushing -- what it skips, and why it writes no
# whole-run receipt, are stated at tools/gates/gates.py's covering rule (spec/baton.md C-12 ruling C).
gates-fast-cover = { cmd = "python -u tools/gates/gates.py --fast --skip-covered" }
gates-fast-cover-quiet = { cmd = "python -u tools/gates/gates.py --fast --skip-covered --quiet" }
# #1676: what .github/workflows/ci.yml's own required job runs (see that job's own comment for why).
gates-ci-quiet = { cmd = "python -u tools/gates/gates.py --ci --quiet" }
gate-sabotage = { cmd = "python -u tools/gates/sabotage.py" }
# #1636 (spec/baton.md C-12): what .githooks/pre-push runs before deciding whether to skip.
# #1910: through buildlock.py's read-only priority class, not unwrapped -- it is pure git and file
# reads, so it runs immediately instead of queueing behind a lane's `dotnet test`, and the class's
# own guard (buildlock.py's `starts_msbuild`) is what keeps that declaration honest if this line
# ever grows a build. Enforced rather than left to the accident of an unwrapped task line.
gates-check-receipt = { cmd = "python -u tools/buildlock.py --class readonly python -u tools/gates/gates.py --check-receipt" }

# One-time per clone: point git at the committed hooks. .git/hooks is not version-controlled, so a
# pre-push gate left there binds one machine and silently protects nobody else.
setup-hooks = { cmd = "git config core.hooksPath .githooks" }

# The free half of the same suite, and the trigger for the paid half: compares each installed CLI's
# `--version` against the version recorded in the lock file. Starts no session and spends no quota,
# so it runs in the ordinary dev loop and, since #1487, in `gates`/`gates-fast` (AFTER_BUILD_FAST) --
# `pixi run test` runs the same DriftGrace.Evaluate verdict via Baton.Architecture.Tests, which is what
# actually makes a vendor self-update surface, but this is the layer that PRINTS: within the 7-day
# grace window drift is a loud WARN and exit 0, past it or on unreadable bookkeeping it is a FAIL, and
# with no vendor CLI present to inspect it says so plainly without failing.
vendor-check = { cmd = "python tools/buildlock.py dotnet run --project tools/Baton.VendorProbe -- --check" }

# #1413: pure-Python red/green check that the fleet-glass pusher's secret gate fails CLOSED (a
# missing/unreadable secretpatterns.local.txt withholds every deliverable) and that its dedupe and
# artifact-selection rules discriminate, over synthetic temp fixtures -- no network, no real
# ~/.baton. Not wired into gates/gates-fast: fleet-glass is an unbuilt-by-CI operator tool (like
# vendor-verify above), run by whoever touches pusher.py rather than on every PR.
fleet-glass-pusher-selftest = { cmd = "python tools/fleet-glass/pusher.py --selftest" }

# #1656 F2 (2026-09-02 review): the JS-side twin of the selftest above -- worker.core.mjs's
# deliverables_list/fleet_status paging and the heartbeat-merge (maxIsoOrNull), over synthetic
# in-memory fixtures via plain `node`, no live Cloudflare Worker/KV. Same "operator tool, not
# CI-wired" posture as fleet-glass-pusher-selftest.
fleet-glass-worker-selftest = { cmd = "node tools/fleet-glass/worker.selftest.mjs" }

# M13 Phase 4 (#110), the milestone's completion gate: unlike smoke-claude/smoke-mixed-vendor
# above, this needs no live vendor auth, so it runs unattended in default CI rather than a gated
# runbook. Packs `baton`, installs it as a real global tool from that local nupkg, runs it against a
# one-step workflow whose `claude` adapter is satisfied by a local stub binary (no network), asserts
# the declared output landed on disk, then uninstalls -- see scripts/verify-pack-roundtrip.sh.
verify-pack = { cmd = "bash scripts/verify-pack-roundtrip.sh", depends-on = ["pack"] }

# #1645 / #1668: the one-command refresh of the installed tool -- side-by-side per-commit install into
# ~/.baton/tools/<sha> (no drain wait needed), verify directly, flip ~/.baton/tools/current atomically,
# install launcher into ~/.dotnet/tools, rebuild Debug CLI for pusher, restart fleet-glass-pusher,
# and prune old unreferenced versions. Not wrapped in buildlock.py itself: the script's own `pixi run pack`
# call is (see pack above), and wrapping twice would self-deadlock. Not built/tested by default CI --
# like pack/verify-pack, this needs the checkout to pack from, and mutates this machine's real installed tool,
# so it stays operator-run rather than gated.
tool-refresh = { cmd = "python tools/tool-refresh/refresh.py" }
tool-refresh-selftest = { cmd = "python -u tools/tool-refresh/refresh.py --selftest" }

# #1670 F2: exercises baton.cmd/baton.ps1 end to end against a mock exe fixture. Isolation and
# overlap-safety rationale live in tools/gates/gates.py's OVERLAP comment, where this is wired in.
launcher-selftest = { cmd = "powershell.exe -NoProfile -File tests/Launcher.Tests.ps1" }
