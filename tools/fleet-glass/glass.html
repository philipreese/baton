function formatDismissedNote(totalDismissed, failedCount, stalledCount, doneCount){
  if(totalDismissed <= 0) return "";
  const parts = [];
  if(failedCount > 0){
    parts.push(failedCount === 1 && totalDismissed > 1 ? "1 of them Failed" : failedCount === 1 && totalDismissed === 1 ? "1 of them Failed" : `${failedCount} Failed`);
  }
  if(stalledCount > 0){
    parts.push(stalledCount === 1 && totalDismissed > 1 && failedCount === 0 ? "1 of them Stalled" : stalledCount === 1 && totalDismissed === 1 ? "1 of them Stalled" : `${stalledCount} Stalled`);
  }
  const detail = parts.join(", ");
  const countLabel = totalDismissed === 1 ? "1 hidden" : `${totalDismissed} hidden`;
  return `${countLabel}${detail ? ` · ${detail}` : ""} · <a id="restore-dismissed">restore</a>`;
}
// #1678: Combo C+E -- a three-column state board (Needs You / Running / Done) with a detail pane
// that opens on tap, docked beside the board on desktop and a slide-in second screen on the phone
// (≤480px). Bucketing/dismiss/pagination logic below is unchanged from the pre-#1678 section
// layout -- only how the buckets get PAINTED (columns + cards + pane instead of <h2> sections +
// full lane cards) is new.
function render(rooms, pushedAt, underhood, heartbeatAt, timelines, staleHiddenCount, dismissed = dismissedRooms, conductor = lastGood && lastGood.conductor, derivedAt = lastGood && lastGood.derived_at){
  const openTimelinePaths = new Set();
  if(typeof document !== "undefined"){
    for(const el of document.querySelectorAll("#content details.tl-details[open]")){
      if(el.dataset.roomPath) openTimelinePaths.add(el.dataset.roomPath);
    }
  }

  const running = rooms.filter(r => r.state === "Running");
  // #1582: a Stalled room -- a retry scheduled inside a process that no longer exists -- gets its
  // own bucket rather than falling into Running (wrong: nothing is happening) or the generic
  // exact-match buckets below (which would drop it off the page entirely, since "Stalled" matches
  // none of them and is truthy so it also misses the `other` catch-all).
  const stalled = rooms.filter(r => r.state === "Stalled");
  // #1586 S1: same hole Stalled itself closed pre-#1582 -- a truthy, unrecognized state string
  // matches none of the exact-match buckets below AND isn't `!r.state`, so without its own bucket
  // it would vanish off the page entirely rather than surface anywhere. Producer since #1608.
  const indeterminate = rooms.filter(r => r.state === "Indeterminate");
  // #1698: Cancelled (`baton cancel`'s terminal word) rides the Failed bucket -- over, not
  // successful, dismissable, deletable. Measured 9/2: 29 of 72 live rooms were Cancelled and none
  // rendered, the same truthy-unrecognised-state hole Stalled and Indeterminate closed above.
  const isFailedLike = (r) => r.state === "Failed" || r.state === "Cancelled";
  const failed  = rooms.filter(isFailedLike);
  const done    = rooms.filter(r => r.state === "Succeeded");
  const other   = rooms.filter(r => !r.state);
  // #1656: fold in whatever terminal-archive pages the operator has already loaded via "load
  // older" -- deduped against the hot set by path, since fleet_status's `page=0` deliberately
  // returns the same newest terminal rooms the hot set already carries (split_hot_and_archive's own
  // doc: the archive is the full population, not just the tail beyond the cap).
  if(terminalArchiveExtra.length){
    const seenPaths = new Set(failed.concat(done).map(r => r.path));
    for(const r of terminalArchiveExtra){
      if(!r || !r.path || seenPaths.has(r.path)) continue;
      seenPaths.add(r.path);
      (isFailedLike(r) ? failed : r.state === "Succeeded" ? done : other).push(r);
    }
  }
  const byNewest = (a,b) => (newestStepTime(b)||"").localeCompare(newestStepTime(a)||"");
  running.sort(byNewest); stalled.sort(byNewest); indeterminate.sort(byNewest); failed.sort(byNewest); done.sort(byNewest);

  const dismissedSet = dismissed instanceof Set ? dismissed : new Set(Array.isArray(dismissed) ? dismissed : []);
  const isDismissed = (r) => r && r.path && dismissedSet.has(r.path);

  const dismissedStalled = stalled.filter(isDismissed);
  const visibleStalled = stalled.filter(r => !isDismissed(r));
  const dismissedFailed = failed.filter(isDismissed);
  const visibleFailed = failed.filter(r => !isDismissed(r));
  const dismissedDone = done.filter(isDismissed);
  const visibleDone = done.filter(r => !isDismissed(r));

  const totalDismissed = dismissedFailed.length + dismissedDone.length + dismissedStalled.length;

  // Needs You: the conductor pinned first, then Stalled + Indeterminate (both "nothing moves this
  // without a person", the same reasoning the pre-#1678 layout already applied by keeping them out
  // of the collapsible Terminal section). Done: Failed + Succeeded together -- both are over, only
  // the outcome differs, and both get a card dismiss (×) button.
  const needsYouRooms = visibleStalled.concat(indeterminate).sort(byNewest);
  const doneRooms = visibleFailed.concat(visibleDone).sort(byNewest);
  const roomsByPath = new Map();
  for(const r of rooms) if(r && r.path) roomsByPath.set(r.path, r);
  for(const r of terminalArchiveExtra) if(r && r.path && !roomsByPath.has(r.path)) roomsByPath.set(r.path, r);

  const hasConductor = !!(conductor && conductor.artifacts_path);
  if(selectedCardKey === null){
    // First render only -- pick a default so the pane is never empty on load, without yanking the
    // operator's own selection out from under them on a later poll.
    selectedCardKey = hasConductor ? CONDUCTOR_KEY
      : needsYouRooms[0] ? needsYouRooms[0].path
      : running[0] ? running[0].path
      : doneRooms[0] ? doneRooms[0].path
      : null;
  }

  const needsYouCards = (hasConductor ? conductorCardHtml(conductor, selectedCardKey) : "")
    + needsYouRooms.map(r => roomCardHtml(r, selectedCardKey, r.state !== "Indeterminate")).join("");
  const runningCards = running.map(r => roomCardHtml(r, selectedCardKey, false)).join("");
  let doneCards = doneRooms.map(r => roomCardHtml(r, selectedCardKey, true)).join("");
  // #1656: terminalTotal (server's count of ALL terminal rooms) vs. failed.length+done.length
  // (everything actually loaded so far, hot set + any "load older" pages) -- offer the link only
  // while there is provably more archive left to fetch.
  const loadedTerminalCount = failed.length + done.length;
  if(terminalTotal != null && loadedTerminalCount < terminalTotal && terminalNextPage != null){
    doneCards += `<a id="load-more-terminal" class="loadmore">load older (${terminalTotal - loadedTerminalCount} more)</a>`;
  }

  const needsYouDismissAll = visibleStalled.length > 0 ? `<a class="dismissall" data-section="stalled">dismiss stalled</a>` : "";
  const doneDismissBits = [];
  if(visibleFailed.length > 0) doneDismissBits.push(`<a class="dismissall" data-section="failed">dismiss failed</a>`);
  if(visibleDone.length > 0) doneDismissBits.push(`<a class="dismissall" data-section="succeeded">dismiss succeeded</a>`);
  // #1659: "copy prune" -- the batch form of a Done card's own "copy delete" verb. Copies the
  // dry-run form (no --yes): the operator reviews what would be removed before opting into the
  // destructive form themselves, same "copy text, never execute" contract every button on this page
  // follows (spec/baton.md §10: origination and arrest stay orchestrator-only).
  if(loadedTerminalCount > 0) doneDismissBits.push(copyButtonHtml("baton rooms prune --terminal", "copy prune"));
  const doneColumnExtra = doneDismissBits.length ? `<div class="column-extra">${doneDismissBits.join(" ")}</div>` : "";

  const needsYouCount = (hasConductor ? 1 : 0) + needsYouRooms.length;
  const needsYouColumn = boardColumnHtml("Needs You", needsYouCount, needsYouDismissAll ? `<div class="column-extra">${needsYouDismissAll}</div>${needsYouCards}` : needsYouCards);
  const runningColumn = boardColumnHtml("Running", running.length, runningCards);
  const doneColumn = boardColumnHtml("Done", loadedTerminalCount, doneColumnExtra + doneCards);

  const showingDetail = phoneShowDetail;
  const boardHtml = underhoodHtml(underhood)
    + `<div class="board-detail-layout${showingDetail ? " showing-detail" : ""}">`
    + `<div class="board-area">`
    + `<div class="phone-carousel-pills">`
    + `<button class="carousel-tab-btn${phoneActiveColumn === "needsyou" ? " active" : ""}" data-col="needsyou">Needs You (${needsYouCount})</button>`
    + `<button class="carousel-tab-btn${phoneActiveColumn === "running" ? " active" : ""}" data-col="running">Running (${running.length})</button>`
    + `<button class="carousel-tab-btn${phoneActiveColumn === "done" ? " active" : ""}" data-col="done">Done (${loadedTerminalCount})</button>`
    + `</div>`
    + `<div class="board-container">`
    + `<div class="board-column-wrap${phoneActiveColumn === "needsyou" ? " active-col" : ""}">${needsYouColumn}</div>`
    + `<div class="board-column-wrap${phoneActiveColumn === "running" ? " active-col" : ""}">${runningColumn}</div>`
    + `<div class="board-column-wrap${phoneActiveColumn === "done" ? " active-col" : ""}">${doneColumn}</div>`
    + `</div></div>`
    + `<div class="board-detail-side">${detailPaneHtml(selectedCardKey, roomsByPath, conductor, timelines, openTimelinePaths, true, derivedAt)}</div>`
    + `</div>`;

  const unreadableWasOpen = !!($("unreadable-details") && $("unreadable-details").open);
  const other20 = other.length ? `<details id="unreadable-details"${unreadableWasOpen ? " open" : ""}><summary>Unreadable entries · ${other.length}</summary><div class="lanes">${other.slice(0,20).map(r => laneHtml(r, timelines, false, openTimelinePaths)).join("")}</div></details>` : "";

  $("content").innerHTML = boardHtml + other20;
  // #1710: newest stdout at the bottom -- the pane is rebuilt wholesale every render, so there is no
  // scroll position to preserve; just land on the newest line each time, same convention the tail
  // itself follows (oldest first, newest last).
  const stdoutTailEl = $("content").querySelector(".stdout-tail");
  if(stdoutTailEl) stdoutTailEl.scrollTop = stdoutTailEl.scrollHeight;
  $("fresh").textContent = freshLabel(pushedAt, "pushed ") || "push time unknown";
  const hb = freshLabel(heartbeatAt, "pusher alive ");
  if(hb) $("fresh").textContent += " · " + hb;
  // #1505 landmine #43: a stale-room drop is now a visible count, never silence.
  $("stalenote").textContent = staleHiddenCount
    ? `${staleHiddenCount} room(s) hidden — older than the pusher's retention window`
    : "";

  const dismissNoteEl = $("dismissnote");
  if(dismissNoteEl){
    dismissNoteEl.innerHTML = formatDismissedNote(totalDismissed, dismissedFailed.length, dismissedStalled.length, dismissedDone.length);
  }
}
// "pushed X ago" measures the SNAPSHOT (legitimately stale on a quiet fleet, #1457's change-gate);
// "pusher alive X ago" measures the PUSHER PROCESS itself (hourly heartbeat, #1486) -- the two are
// deliberately independent so a quiet fleet with an old snapshot still reads as healthy.
function freshLabel(iso, prefix){
  if(!iso) return null;
  const a = age(iso);
  return prefix + (a || new Date(iso).toLocaleTimeString()) + (a && a !== "just now" ? " ago" : "");
}
function banner(html){ $("banner").innerHTML = html ? `<div class="banner">${html}</div>` : ""; }

// #1391: advisory per-vendor usage runway -- one row per window per vendor, percent/reset/burn/caveat,
// "unknown" whenever the harvester couldn't parse a field. Nothing here gates dispatch (#1848 owns
// that); this is read-only display of `snap.vendors`, absent-safe like `conductor`/`staleness` above.
// #1746 adds two DERIVED cells per row -- burn rate and minutes to exhaustion. Both arrive already
// computed on `windows[]` (the daemon's projection owns the one arithmetic, spec/baton.md §6); this
// file never derives them from percent history of its own. "unknown" whenever either is absent, on
// exactly the same freshness footing as the block head's harvest age: these describe the last
// harvest, not this instant, so an old `harvestedAt` qualifies them just as it qualifies the percent.
// #1904: `derived` is the block's own `source === "derived"`, passed down because it changes what an
// ABSENT field means on the row. On a vendor block, a missing `resetsAt` means the vendor's reset
// clause did not parse -- "reset unknown" is the honest word. On a derived block the windows are a
// rolling lookback with no reset instant BY CONSTRUCTION (CodexUsageSource's own doc comment), so
// "unknown" would report a parse failure that did not happen and imply a boundary that does not exist.
function vendorUsageRowHtml(vendor, w, derived){
  const pct = typeof w.percentUsed === "number" ? `${w.percentUsed}% used` : "unknown";
  const resets = w.resetsAt ? `resets ${new Date(w.resetsAt).toLocaleString()}`
    : derived ? "rolling window, no reset" : "reset unknown";
  const rate = typeof w.ratePctPerHour === "number" ? `${w.ratePctPerHour}%/h` : "rate unknown";
  const eta = typeof w.minutesToExhaustion === "number"
    ? `${w.minutesToExhaustion < 90 ? Math.round(w.minutesToExhaustion) + "m"
        : Math.round(w.minutesToExhaustion / 60) + "h"} to exhaustion`
    : "exhaustion unknown";
  return `<div class="vendorusage-row"><span class="vendorusage-adapter">${esc(vendor)}</span> `
    + `<span class="vendorusage-window">${esc(w.name)}</span> `
    + `<span class="vendorusage-pct">${esc(pct)}</span> `
    + `<span class="vendorusage-reset">${esc(resets)}</span> `
    + `<span class="vendorusage-rate">${esc(rate)}</span> `
    + `<span class="vendorusage-eta">${esc(eta)}</span></div>`;
}
function vendorUsageHtml(vendors){
  if(!Array.isArray(vendors) || vendors.length === 0){ $("vendorusage").innerHTML = ""; return; }
  const blocks = vendors.map(v => {
    const windows = Array.isArray(v.windows) ? v.windows : [];
    const isDerived = v.source === "derived";
    const rows = windows.length
      ? windows.map(w => vendorUsageRowHtml(v.adapter, w, isDerived)).join("")
      : `<div class="vendorusage-row">${esc(v.adapter)} unknown</div>`;
    const caveat = typeof v.caveat === "string" && v.caveat
      ? `<div class="vendorusage-caveat">${esc(v.caveat)}</div>` : "";
    const liveLanes = typeof v.liveLanes === "number" ? v.liveLanes : 0;
    // age() already returns the WORD "just now" under a minute (and null for an absent/unparseable
    // instant), so the " ago" suffix belongs only to the duration case -- otherwise the header reads
    // "harvested just now ago" / "harvested unknown ago" (#1869 review). Build the whole clause.
    const harvestAge = age(v.harvestedAt);
    const harvested = harvestAge === null ? "harvest time unknown"
      : harvestAge === "just now" ? "harvested just now"
      : `harvested ${harvestAge} ago`;
    // #1904: `source` says whether these windows are the vendor's own counter or Baton's derivation
    // from its own burn ledger. The word is rendered ONLY on a derived block -- "vendor" is the
    // default every #1391 block already was, and labelling it would train the eye past the one label
    // that carries information. Absent `source` (a pre-#1904 projection) reads as vendor, matching
    // PersistedVendorUsage.Source's own default.
    const derived = isDerived ? ", derived — not a vendor counter" : "";
    return `<div class="vendorusage-block"><div class="vendorusage-head">${esc(v.adapter)} — `
      + `${liveLanes} live lane${liveLanes === 1 ? "" : "s"}, ${esc(harvested)}${esc(derived)}</div>`
      + rows + caveat + `</div>`;
  }).join("");
  $("vendorusage").innerHTML = `<div class="vendorusage">${blocks}</div>`;
}

// #1656: on-demand paging over the terminal archive (see terminalArchiveExtra's own comment at its
// declaration). One-shot fetch on click -- `refetchInterval: 0` means this watchTool call does not
// join the periodic 30s poll the main fleet_status subscription already runs; it settles once and
// the callback re-renders from the (module-level) accumulated state.
function loadMoreTerminal(){
  if(!window.mcpHandle || terminalNextPage == null) return;
  window.mcpHandle.watchTool("baton", "fleet_status", { page: terminalNextPage, limit: 50 }, (ev) => {
    if(ev.type !== "data") return;
    let payload = ev.result.payload;
    if(typeof payload === "string"){ try { payload = JSON.parse(payload); } catch { payload = null; } }
    if(!payload || !Array.isArray(payload.rooms)) return;
    const known = new Set(terminalArchiveExtra.map(r => r && r.path));
    for(const r of payload.rooms){
      if(r && r.path && !known.has(r.path)){ terminalArchiveExtra.push(r); known.add(r.path); }
    }
    if(typeof payload.terminal_total === "number") terminalTotal = payload.terminal_total;
    terminalNextPage = typeof payload.next_page === "number" ? payload.next_page : null;
    if(lastGood){
      render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms);
    }
  }, { refetchInterval: 0 });
}

// -----------------------------------------------------------------------------------------------
// Deliverables inbox (#1413, merged into this artifact as a tab by #1505 item 4). Same data
// contract as the deleted inbox.html: deliverables_list({room?}) -> {items, count},
// deliverable_read({id}) -> full text. Markdown rendering stays DELIBERATELY MINIMAL (headings,
// code fences, bold/italic, links, bullet lists, paragraphs) -- enough for this pipeline's own
// report markdown, not a general CommonMark implementation. Everything is HTML-escaped before any
// markup is applied.
// -----------------------------------------------------------------------------------------------
function verdictChip(v){
  const state = typeof v === "string" ? v : (v && v.state);
  if(!state) return ["?","c-idle"];
  const upper = state.toUpperCase();
  if(upper === "SUCCEEDED" || upper === "OK" || upper === "APPROVE" || upper === "APPROVED" || upper === "PASS" || upper === "PASSED") return [typeof v === "string" ? upper : "OK", "c-ok"];
  if(upper === "FAILED" || upper === "REQUEST-CHANGES" || upper === "REQUEST_CHANGES" || upper === "FAIL" || upper === "REJECT" || upper === "REJECTED") return [typeof v === "string" ? upper : "FAILED", "c-bad"];
  if(upper === "WARN" || upper === "WARNING") return [upper, "c-warn"];
  return [upper, "c-idle"];
}
function findingSeverityChip(sev){
  if(!sev) return null;
  const s = String(sev).toLowerCase();
  if(s === "high" || s === "critical" || s === "error") return [s.toUpperCase(), "c-bad"];
  if(s === "medium" || s === "med" || s === "warn" || s === "warning") return [s.toUpperCase(), "c-warn"];
  if(s === "low" || s === "info") return [s.toUpperCase(), "c-idle"];
  return [s.toUpperCase(), "c-idle"];
}
function findingStatusChip(st){
  if(!st) return null;
  const s = String(st).toLowerCase();
  if(s === "confirmed") return [s.toUpperCase(), "c-ok"];
  if(s === "refuted") return [s.toUpperCase(), "c-idle"];
  if(s === "unverified") return [s.toUpperCase(), "c-warn"];
  return [s.toUpperCase(), "c-idle"];
}
function findingHtml(f){
  if(!f || typeof f !== "object") return `<div class="finding"><div class="finding-claim">${esc(String(f))}</div></div>`;
  const claim = f.claim || f.title || "";
  const chips = [];
  const sev = findingSeverityChip(f.severity);
  if(sev) chips.push(`<span class="chip ${sev[1]}">${esc(sev[0])}</span>`);
  const st = findingStatusChip(f.status);
  if(st) chips.push(`<span class="chip ${st[1]}">${esc(st[0])}</span>`);

  let anchor = "";
  if(f.anchor){
    if(typeof f.anchor === "object"){
      const file = f.anchor.file || "";
      const line = f.anchor.line != null ? `:${f.anchor.line}` : "";
      if(file) anchor = `<div class="finding-anchor mono">${esc(file + line)}</div>`;
    } else if(typeof f.anchor === "string"){
      anchor = `<div class="finding-anchor mono">${esc(f.anchor)}</div>`;
    }
  }
  const detail = f.detail || f.body || "";
  // Review lanes author markdown in detail/body (#1543) -- render it (renderMarkdown escapes
  // internally) instead of showing literal ## headings and hard-wrapped source lines.
  const detailHtml = detail ? `<div class="finding-detail">${renderMarkdown(detail)}</div>` : "";
  return `<div class="finding">
    <div class="finding-top">
      <span class="finding-claim">${esc(claim || "Finding")}</span>
      ${chips.length ? `<span class="finding-chips">${chips.join("")}</span>` : ""}
    </div>
    ${anchor}
    ${detailHtml}
  </div>`;
}
function formatMetaValue(val){
  if(val == null) return "—";
  // Multiline string values (e.g. a verdict's summary) are markdown-authored prose (#1543);
  // single-line values stay plain escaped text.
  if(typeof val === "string") return /\n/.test(val) ? renderMarkdown(val) : esc(val);
  if(typeof val === "number" || typeof val === "boolean") return esc(String(val));
  return `<pre><code>${esc(JSON.stringify(val, null, 2))}</code></pre>`;
}
function renderVerdictDoc(data){
  const dts = [];
  for(const k of Object.keys(data)){
    if(k === "findings" || k === "verdict") continue;
    dts.push(`<dt>${esc(k)}</dt><dd>${formatMetaValue(data[k])}</dd>`);
  }
  const metaHtml = dts.length ? `<dl>${dts.join("")}</dl>` : "";
  let findingsHtml = "";
  if(Array.isArray(data.findings)){
    const items = data.findings.map(findingHtml).join("");
    findingsHtml = `<h3>Findings · ${data.findings.length}</h3>` + (items || `<div class="empty">No findings recorded.</div>`);
  }
  return metaHtml + findingsHtml;
}
function renderMarkdown(text){
  // Windows lanes write CRLF deliverables (#1545); a trailing \r defeats the heading/bullet
  // regexes' (.*)$ anchors (JS "." never matches \r), so normalize before splitting.
  const lines = esc(text ?? "").replace(/\r\n?/g, "\n").split("\n");
  let html = "";
  let inCode = false, inList = null;
  let para = [], table = [], bq = [];
  const flushPara = () => {
    if(para.length){
      html += `<p>${inline(para.join(" "))}</p>`;
      para = [];
    }
  };
  const flushList = () => {
    if(inList === "ul"){ html += "</ul>"; inList = null; }
    else if(inList === "ol"){ html += "</ol>"; inList = null; }
  };
  const flushBq = () => {
    if(bq.length){
      html += `<blockquote><p>${inline(bq.join(" "))}</p></blockquote>`;
      bq = [];
    }
  };
  const parseCells = (line) => {
    const clean = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    const protectedLine = clean.replace(/\\\|/g, "\u0000");
    return protectedLine.split("|").map(c => c.replace(/\u0000/g, "|").trim());
  };
  const isSeparatorRow = (line) => {
    const cells = parseCells(line);
    return cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c));
  };
  const flushTable = () => {
    if(!table.length) return;
    if(table.length >= 2 && isSeparatorRow(table[1])){
      const headers = parseCells(table[0]);
      const rows = table.slice(2).map(parseCells);
      let tHtml = '<div class="table-wrap"><table><thead><tr>';
      tHtml += headers.map(h => `<th>${inline(h)}</th>`).join("");
      tHtml += '</tr></thead><tbody>';
      for(const row of rows){
        tHtml += '<tr>';
        tHtml += row.map(c => `<td>${inline(c)}</td>`).join("");
        tHtml += '</tr>';
      }
      tHtml += '</tbody></table></div>';
      html += tHtml;
    } else {
      html += `<pre><code>${table.join("\n")}</code></pre>`;
    }
    table = [];
  };
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) => /^https?:\/\//.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : m);
  for(const raw of lines){
    if(raw.trim().startsWith("```")){
      flushPara();
      flushTable();
      flushBq();
      flushList();
      html += inCode ? "</code></pre>" : "<pre><code>";
      inCode = !inCode;
      continue;
    }
    if(inCode){ html += raw + "\n"; continue; }
    const heading = raw.match(/^(#{1,6})\s+(.*)$/);
    if(heading){
      flushPara();
      flushTable();
      flushBq();
      flushList();
      const level = heading[1].length;
      html += `<h${level}>${inline(heading[2])}</h${level}>`;
      continue;
    }
    if(/^(\s*[-*_]\s*){3,}$/.test(raw)){
      flushPara();
      flushTable();
      flushBq();
      flushList();
      html += "<hr>";
      continue;
    }
    const bqMatch = raw.match(/^\s*(?:>|&gt;)\s?(.*)$/);
    if(bqMatch){
      flushPara();
      flushTable();
      flushList();
      bq.push(bqMatch[1]);
      continue;
    }
    flushBq();
    const bullet = raw.match(/^\s*[-*]\s+(.*)$/);
    if(bullet){
      flushPara();
      flushTable();
      if(inList !== "ul"){
        flushList();
        html += "<ul>";
        inList = "ul";
      }
      html += `<li>${inline(bullet[1])}</li>`;
      continue;
    }
    const numMatch = raw.match(/^\s*\d+\.\s+(.*)$/);
    if(numMatch){
      flushPara();
      flushTable();
      if(inList !== "ol"){
        flushList();
        html += "<ol>";
        inList = "ol";
      }
      html += `<li>${inline(numMatch[1])}</li>`;
      continue;
    }
    if(raw.trim() === ""){
      flushPara();
      flushTable();
      flushList();
      continue;
    }
    if(/^\s*\|/.test(raw)){
      flushPara();
      flushList();
      table.push(raw);
      continue;
    }
    flushTable();
    flushList();
    para.push(raw.trim());
  }
  flushPara();
  flushTable();
  flushBq();
  flushList();
  if(inCode) html += "</code></pre>";
  return html;
}
function itemRow(item){
  const isConductor = item.kind === "conductor";
  const [label, cls] = isConductor ? ["CONDUCTOR", "c-run"] : verdictChip(item.verdict);
  const a = age(item.created_at || item.pushed_at);
  const withheld = item.withheld ? ` · <span title="${esc(item.stub_reason || "")}">withheld</span>` : "";
  const roomLabel = item.room_name || item.room;
  return `<div class="item" data-id="${esc(item.id)}">
    <div class="top"><span class="title">${esc(item.title || item.artifact || item.id)}</span><span class="chip ${cls}">${label}</span></div>
    <div class="meta">${esc(roomLabel)}${item.artifact ? " · " + esc(item.artifact) : ""} · ${a ? a + " ago" : "?"}${withheld}</div>
  </div>`;
}
function renderInboxList(items, roomFilter, count){
  let filterLabel = roomFilter;
  if(roomFilter){
    const match = (items.length > 0 ? items : inboxIndex).find(m => m.room === roomFilter && m.room_name);
    if(match) filterLabel = match.room_name;
  }
  $("filter").innerHTML = roomFilter
    ? `filtered to room <b>${esc(filterLabel)}</b> · <a id="clearfilter">clear</a>`
    : "";
  const clear = $("clearfilter");
  if(clear) clear.addEventListener("click", () => { inboxRoomFilter = ""; location.hash = "#inbox"; applyRoute(); });
  const list = items.length
    ? items.map(itemRow).join("")
    : `<div class="empty">No deliverables ${roomFilter ? "for this room " : ""}yet.</div>`;
  // #1656 F1: "showing N of count" plus a load-more control mirroring loadMoreTerminal() above --
  // never silently truncate to the first page. `count` is null only before the first page for the
  // current filter has come back (fetchInboxPage's one-shot fetch); the summary line waits for it.
  const summary = count != null
    ? `<div class="lanes">showing ${items.length} of ${count}`
      + (inboxNextCursor != null ? ` · <a id="load-more-inbox" class="loadmore">load more</a>` : "")
      + `</div>`
    : "";
  $("inboxcontent").innerHTML = list + summary;
  for(const el of document.querySelectorAll("#inboxcontent .item")){
    el.addEventListener("click", () => { location.hash = "#inbox:" + encodeURIComponent(el.dataset.id); });
  }
}
function renderInboxDoc(item, text){
  let parsed = null;
  if(typeof text === "string" && text.trim()){
    try { parsed = JSON.parse(text); } catch { parsed = null; }
  }
  const isVerdictShaped = parsed && typeof parsed === "object" && !Array.isArray(parsed) && (
    Array.isArray(parsed.findings) || typeof parsed.verdict === "string"
  );
  const isConductor = item && item.kind === "conductor";
  const verdictForChip = (isVerdictShaped && typeof parsed.verdict === "string") ? parsed.verdict : (item && item.verdict);
  const [label, cls] = isConductor ? ["CONDUCTOR", "c-run"] : verdictChip(verdictForChip);
  const verdict = isConductor ? null : (item && item.verdict);
  const verdictLine = verdict
    ? `<div class="meta">${esc(verdict.state || "?")}${verdict.error ? " — " + esc(verdict.error) : ""}${verdict.try ? " (" + esc(verdict.try) + ")" : ""}</div>`
    : "";

  let docHtml = "";
  if(isVerdictShaped){
    docHtml = renderVerdictDoc(parsed);
  } else if(parsed !== null){
    docHtml = `<pre><code>${esc(JSON.stringify(parsed, null, 2))}</code></pre>`;
  } else {
    docHtml = renderMarkdown(text);
  }

  $("inboxcontent").innerHTML = `
    <a class="back" id="inboxback">&larr; back to inbox</a>
    <h2>${esc((item && (item.title || item.artifact)) || "")} <span class="chip ${cls}">${label}</span></h2>
    ${verdictLine}
    <div class="doc">${docHtml}</div>`;
  $("inboxback").addEventListener("click", () => { location.hash = "#inbox"; });
}

// -----------------------------------------------------------------------------------------------
// Tabs + hash routing. "" = Fleet; "#inbox" = inbox list; "#inbox:<id>" = one inbox item. Clicking
// a room's "deliverables →" link sets the in-memory room filter and switches tabs client-side --
// no navigation, since this is one page now (#1505 item 4).
// -----------------------------------------------------------------------------------------------
let inboxRoomFilter = new URLSearchParams(location.search).get("room") || "";
let inboxIndex = [];
// #1656 F1: on-demand paging over the inbox, mirroring terminalArchiveExtra/terminalNextPage/
// terminalTotal below. inboxExtra/inboxCount/inboxNextCursor are (re)populated by fetchInboxPage
// whenever the active filter changes (including landing on the unfiltered view) or "load more" is
// clicked; inboxLoadedFilter records which filter they currently answer for, so switching rooms
// resets accumulation instead of mixing pages fetched under a different filter.
let inboxExtra = [];
let inboxCount = null;
let inboxNextCursor = null;
let inboxLoadedFilter = null;
// One-shot fetch of a deliverables_list page for `room` (empty string/undefined = unfiltered),
// scoped by an opaque cursor from a prior call's next_cursor. `replace` is true for the first page
// of a (re)started filter -- overwrites inboxExtra outright rather than appending, since a filter
// switch must not mix pages fetched under the OLD filter into the new one's count/items.
function fetchInboxPage(room, cursor, replace){
  if(!window.mcpHandle) return;
  const args = { limit: 50 };
  if(room) args.room = room;
  if(cursor) args.cursor = cursor;
  window.mcpHandle.watchTool("baton", "deliverables_list", args, (ev) => {
    if(ev.type !== "data") return;
    let payload = ev.result.payload;
    if(typeof payload === "string"){ try { payload = JSON.parse(payload); } catch { payload = null; } }
    if(!payload || !Array.isArray(payload.items)) return;
    if(replace){
      inboxExtra = payload.items;
    } else {
      const known = new Set(inboxExtra.map(m => m && m.id));
      for(const it of payload.items){ if(it && it.id && !known.has(it.id)){ inboxExtra.push(it); known.add(it.id); } }
    }
    if(typeof payload.count === "number") inboxCount = payload.count;
    inboxNextCursor = payload.next_cursor || null;
    if(!location.hash.startsWith("#inbox:")) applyRoute();
  }, { refetchInterval: 0 });
}
function loadMoreInbox(){
  if(inboxNextCursor == null) return;
  fetchInboxPage(inboxRoomFilter, inboxNextCursor, false);
}
function applyRoute(){
  const h = location.hash;
  const onInbox = h === "#inbox" || h.startsWith("#inbox:");
  $("tab-fleet").classList.toggle("active", !onInbox);
  $("tab-inbox").classList.toggle("active", onInbox);
  $("tab-btn-fleet").classList.toggle("active", !onInbox);
  $("tab-btn-inbox").classList.toggle("active", onInbox);
  if(window.getSelection) { try { window.getSelection().removeAllRanges(); } catch(e){} }
  if(!onInbox) return;
  if(h.startsWith("#inbox:")){
    const id = decodeURIComponent(h.slice(7));
    const item = inboxIndex.find((m) => m.id === id) || { id };
    if(!window.mcpHandle) return;
    window.mcpHandle.watchTool("baton", "deliverable_read", { id }, (ev) => {
      if(ev.type === "data"){
        let text = ev.result.payload;
        if(typeof text !== "string") text = JSON.stringify(text);
        renderInboxDoc(item, text);
      }
    }, { refetchInterval: 0 });
  } else {
    // #1656 F1: a room filter pages the same way the unfiltered view does -- a fresh, server-side
    // room-scoped fetch on every filter switch, never a client-side .filter() of the unfiltered
    // top page (which would silently miss older items for that room, past whatever the unfiltered
    // page happened to carry).
    if(inboxLoadedFilter !== inboxRoomFilter){
      inboxExtra = [];
      inboxNextCursor = null;
      inboxCount = null;
      inboxLoadedFilter = inboxRoomFilter;
      fetchInboxPage(inboxRoomFilter, null, true);
    }
    const base = inboxRoomFilter ? [] : inboxIndex;
    const knownIds = new Set(base.map(m => m && m.id));
    const items = base.concat(inboxExtra.filter(m => m && !knownIds.has(m.id)));
    renderInboxList(items, inboxRoomFilter, inboxCount);
  }
}
let lastGood = null;
let accumulatedTimelines = loadPersistedTimelines();
let dismissedRooms = loadPersistedDismissed();
// #1656: the pushed snapshot's `rooms` only carries non-terminal rooms plus the newest
// HOT_TERMINAL_CAP (pusher.py) terminal ones -- everything older lives server-side in
// worker.js's "terminal_archive" key and is fetched a page at a time via fleet_status's own
// `page`/`limit` arguments (never a second tool -- FleetGlassReadOnlyTests pins the TOOLS array to
// exactly fleet_status/deliverables_list/deliverable_read). `terminalArchiveExtra` accumulates
// pages the operator has actually asked for by clicking "load older"; `terminalTotal` is the
// server's count of ALL terminal rooms, used only to decide whether the link still has more to
// offer; `terminalNextPage` is `null` once the archive is exhausted.
let terminalArchiveExtra = [];
let terminalTotal = null;
let terminalNextPage = 0;
// #1678 (Combo C+E board state): the selected card's key (a room path, or CONDUCTOR_KEY) drives the
// docked/slide-in detail pane; phoneActiveColumn is which carousel pill is showing on a ≤480px
// viewport; phoneShowDetail is whether that viewport is showing the pane (replacing the board) or
// the board itself -- the ruling's "tapping a card replaces the board with the pane plus a Back
// control".
let selectedCardKey = null;
let phoneActiveColumn = "needsyou";
let phoneShowDetail = false;

function rerenderFromLastGood(){
  if(lastGood && Array.isArray(lastGood.rooms)){
    render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms, lastGood.conductor);
  }
}
document.addEventListener("click", (ev) => {
  // #1678: selecting a board card (or the conductor card) just changes which room the detail pane
  // shows -- on a ≤480px viewport it also flips the board over to the pane (CSS's .showing-detail),
  // the ruling's "tapping a card replaces the board with the pane plus a Back control". The per-card
  // dismiss (×) button is a descendant of .board-card, so its own `.dismissbtn` branch further below
  // must run instead of this one -- `isDismissClick` short-circuits the card-select branch for it
  // rather than selecting the card that click just hid.
  const isDismissClick = !!ev.target.closest(".board-card-dismiss");
  const card = !isDismissClick && ev.target.closest(".board-card");
  if(card && card.dataset.key){
    selectedCardKey = card.dataset.key;
    phoneShowDetail = true;
    rerenderFromLastGood();
    return;
  }
  const backBtn = ev.target.closest("#board-back");
  if(backBtn){
    phoneShowDetail = false;
    rerenderFromLastGood();
    return;
  }
  const carouselBtn = ev.target.closest(".carousel-tab-btn");
  if(carouselBtn && carouselBtn.dataset.col){
    phoneActiveColumn = carouselBtn.dataset.col;
    rerenderFromLastGood();
    return;
  }
  const detailPath = ev.target.closest(".detail-path");
  if(detailPath){
    detailPath.classList.toggle("expanded");
    return;
  }
  const loadMoreBtn = ev.target.closest("#load-more-terminal");
  if(loadMoreBtn){
    loadMoreTerminal();
    return;
  }
  const loadMoreInboxBtn = ev.target.closest("#load-more-inbox");
  if(loadMoreInboxBtn){
    loadMoreInbox();
    return;
  }
  const dismissBtn = ev.target.closest(".dismissbtn");
  if(dismissBtn){
    const path = dismissBtn.dataset.path;
    if(path){
      dismissedRooms.add(path);
      savePersistedDismissed(dismissedRooms);
      if(lastGood && Array.isArray(lastGood.rooms)){
        render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms);
      }
    }
    return;
  }
  const dismissAllBtn = ev.target.closest(".dismissall");
  if(dismissAllBtn){
    const section = dismissAllBtn.dataset.section;
    if(lastGood && Array.isArray(lastGood.rooms)){
      const targetState = section === "failed" ? "Failed" : section === "succeeded" ? "Succeeded" : section === "stalled" ? "Stalled" : null;
      if(targetState){
        for(const r of lastGood.rooms){
          if(r && r.path && r.state === targetState){
            dismissedRooms.add(r.path);
          }
        }
        savePersistedDismissed(dismissedRooms);
        render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms);
      }
    }
    return;
  }
  const restoreBtn = ev.target.closest("#restore-dismissed");
  if(restoreBtn){
    dismissedRooms.clear();
    savePersistedDismissed(dismissedRooms);
    if(lastGood && Array.isArray(lastGood.rooms)){
      render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms);
    }
    return;
  }
  const tabBtn = ev.target.closest(".tabbtn");
  if(tabBtn){
    location.hash = tabBtn.dataset.tab === "inbox" ? "#inbox" : "";
    return;
  }
  const inboxLink = ev.target.closest(".inboxlink");
  if(inboxLink){
    inboxRoomFilter = inboxLink.dataset.room || "";
    location.hash = "#inbox";
    if(window.getSelection) { try { window.getSelection().removeAllRanges(); } catch(e){} }
    if(document.activeElement && typeof document.activeElement.blur === "function") document.activeElement.blur();
  }
});
window.addEventListener("hashchange", applyRoute);

(async () => {
  const mcp = await claude.use("mcp");
  if(!mcp){
    banner("<b>No MCP in this view.</b> The fleet feed comes from the <span class='mono'>baton</span> connector; this surface cannot reach connectors.");
    $("fresh").textContent = "static";
    applyRoute();
    return;
  }
  window.mcpHandle = mcp;
  // #1486: heartbeat_at (independent of the change-gated snapshot) is what tells a dead pusher
  // apart from a quiet fleet whose pushed_at is legitimately stale. Loud only past ~2 missed beats
  // + slop, so one delayed cycle doesn't cry wolf.
  const HEARTBEAT_DEAD_MS = 2.5 * 60 * 60 * 1000;
  // #1613 item 2: the "stuck" check below keys on derived_at (when the pusher's OWN snapshot
  // derivation last actually completed), never on pushed_at -- pushed_at legitimately goes stale
  // on a quiet-but-healthy fleet (the #1457 change-gate skips an unchanged snapshot), which is
  // exactly what made the pre-#1613 pushed_at-keyed version of this banner false-fire constantly.
  // derived_at reaches the mailbox on its own ~5-minute cadence independent of whether anything
  // pushed (pusher.py's DERIVED_PING_INTERVAL_SECONDS), so this threshold stays the same order of
  // magnitude the banner already used, rather than degrading to heartbeat's own coarser cadence.
  const RUNNING_SUSPICION_MS = 10 * 60 * 1000;
  // 2026-09-01 review finding 2: pending_push_age_s (seconds the pusher has had content waiting to
  // go out since its last SUCCESSFUL push, present only while something is actually pending -- see
  // pusher.py's own pending_push_age_s doc) is a DIFFERENT failure than the derivation-stuck check
  // below: derivation can keep succeeding every cycle (derived_at stays fresh) while every PUSH
  // fails (a 413 from the 1 MB cap, a 5xx, a network blip) -- dropping the old pushed_at-keyed
  // banner removed the only signal that used to catch that. Same order of magnitude as
  // RUNNING_SUSPICION_MS: a coalesced-but-healthy pending age never exceeds the 90s floor by more
  // than one polling interval, so only a genuinely failing push keeps growing past minutes.
  const PUSH_FAILING_MS = 10 * 60 * 1000;
  // #1829: heartbeat_at and derived_at aging together within this window is NOT a reliable cap
  // tell -- pusher.py's derived-freshness ping writes both into the SAME heartbeat_at value in one
  // POST, so they age together by construction whenever the ping's adaptive pacing widens (an idle
  // fleet), with no cap involved at all. #1712's original reasoning here (kept only for the now-
  // neutral banner below) mistook that construction for evidence; the real cap signal is
  // `pusher.kvWriteCapResetsAt`, sourced from the Worker's own 429. See spec/baton.md §6.
  const KV_CAP_SYNC_MS = 3 * 60 * 1000;
  mcp.watchTool("baton", "fleet_status", {}, (ev) => {
    if(ev.type === "data"){
      let snap = ev.result.payload;
      if(typeof snap === "string"){ try { snap = JSON.parse(snap); } catch { snap = null; } }
      if(snap && Array.isArray(snap.rooms)){
        lastGood = snap;
        accumulatedTimelines = updateAccumulatedTimelines(accumulatedTimelines, snap.rooms, snap.timelines);
        savePersistedTimelines(accumulatedTimelines);
        dismissedRooms = pruneDismissed(dismissedRooms, snap.rooms);
        savePersistedDismissed(dismissedRooms);
        // #1656: terminal_total (absent on an unredeployed pusher, same optional-field convention
        // as every other fleet_status extension) tells the Terminal section's "load older" link
        // whether the hot set's newest-N terminal rooms are the whole population or not -- never
        // reset terminalNextPage here, which would throw away pages the operator already loaded on
        // every 30s poll.
        if(typeof snap.terminal_total === "number") terminalTotal = snap.terminal_total;
        const hbMs = snap.heartbeat_at ? Date.now() - Date.parse(snap.heartbeat_at) : null;
        const derivedMs = snap.derived_at ? Date.now() - Date.parse(snap.derived_at) : null;
        const pendingPushMs = typeof snap.pending_push_age_s === "number" ? snap.pending_push_age_s * 1000 : null;
        const running = snap.rooms.some(r => r.state === "Running");
        // #1690: writeBudgetExhaustedUntil (absent-safe -- an unredeployed pusher never sends a
        // `pusher` section at all) is the LAST snapshot the pusher intentionally sends before it
        // stops pushing for the rest of the UTC day, once its daily KV write budget ledger runs out
        // (spec/baton.md §6, "Fleet Glass write budget"). Checked FIRST: this is an intentional,
        // self-explained stop, not a failure the other banners below would otherwise misdiagnose as
        // a dead pusher or a stuck derivation once pushed_at/derived_at start aging past it.
        const budgetExhaustedUntil = snap.pusher && typeof snap.pusher.writeBudgetExhaustedUntil === "string"
          ? snap.pusher.writeBudgetExhaustedUntil : null;
        // #1829: the ONE real cap signal -- the Worker's own 429 `{"reason": "kv-write-cap",
        // "resets_at"}`, surfaced by pusher.py's mark_kv_write_cap_exhausted into the `pusher`
        // object it sends on its one-shot budget-exhausted notice. Unlike budgetExhaustedUntil
        // above (which fires the moment the pusher's OWN ledger crosses its configured daily
        // target -- a self-imposed, conservative stop that may never touch Cloudflare's actual
        // cap), this field only exists when the Worker itself answered 429. `resets_at` in the
        // past means a stale notice (the ledger has since rolled to a new day) -- treat as absent.
        const kvWriteCapResetsAt = snap.pusher && typeof snap.pusher.kvWriteCapResetsAt === "string"
          && Date.parse(snap.pusher.kvWriteCapResetsAt) > Date.now()
          ? snap.pusher.kvWriteCapResetsAt : null;
        // #1557 PR-B1: absent-safe the same way as writeBudgetExhaustedUntil above -- a pusher not
        // yet running FLEET_GLASS_PROJECTION_SOURCE=file, or one whose read of the daemon's
        // projection file found it fresh, never sends `staleness` at all. Present only on a cycle
        // that fell back to `derive_snapshot_and_timelines` because the file was stale or absent
        // (spec/baton.md §6). Checked right after the write-budget banner, same priority rung: both
        // are the pusher explaining a self-diagnosed source problem, not a downstream KV/heartbeat
        // symptom the banners below would otherwise misdiagnose.
        const staleness = snap.staleness && typeof snap.staleness === "object" ? snap.staleness : null;
        if(kvWriteCapResetsAt){
          banner(`<b>The worker is refusing writes</b> (Cloudflare's daily KV write cap, confirmed by a live 429; writes resume ${esc(kvWriteCapResetsAt)}). Data below is from the last push before the cap hit.`);
        } else if(budgetExhaustedUntil){
          banner(`<b>Write budget exhausted for today.</b> The pusher hit its daily KV write cap and stopped snapshot pushes until ${esc(budgetExhaustedUntil)} — deliverables may still be landing. Data below is from the last push before the stop.`);
        } else if(staleness && staleness.stale){
          const daemonDerivedAt = typeof staleness.daemon_derived_at === "string" ? staleness.daemon_derived_at : null;
          const ageText = typeof staleness.age_s === "number" ? `${Math.round(staleness.age_s)}s old` : "absent";
          banner(`<b>Fleet projection file is stale.</b> The daemon's projection file (${daemonDerivedAt ? `last written ${esc(ageText)}` : "never written, or unreadable"}) fell back to the pusher's own derivation this cycle — data below is live, but check that \`baton daemon\` is running.`);
        } else if(hbMs == null){
          banner("<b>No heartbeat recorded yet.</b> heartbeat_at is unset — redeploy worker.js and the pusher for #1486, or the mailbox hasn't received one yet.");
        } else if(!isFinite(hbMs) || hbMs > HEARTBEAT_DEAD_MS){
          banner(`<b>Pusher likely dead.</b> No heartbeat in ${esc(age(snap.heartbeat_at) || "over 2.5h")} — the fleet machine may be off or the pusher process may have stopped. Data below is from the last push.`);
        } else if(derivedMs == null){
          // Finding 6: mirrors the hbMs==null branch above -- a pusher not yet redeployed for
          // #1613 posts no derived_at at all, and that used to fall through to a silently clean
          // banner, disabling the "derivation may be stuck" check below with no indication why.
          banner("<b>No derivation timestamp yet.</b> derived_at is unset — redeploy pusher.py for #1613, or the mailbox hasn't received one yet.");
        } else if(pendingPushMs != null && isFinite(pendingPushMs) && pendingPushMs > PUSH_FAILING_MS){
          banner(`<b>Push failing.</b> The pusher has had a snapshot waiting to go out for ${esc(dur(pendingPushMs))} even though derivation is healthy (derived_at ${esc(age(snap.derived_at))} ago) — check pusher.log for POST errors (413 from the 1 MB cap, 5xx, network). Data below may be stale.`);
        } else if(isFinite(hbMs) && isFinite(derivedMs) && hbMs > RUNNING_SUSPICION_MS && derivedMs > RUNNING_SUSPICION_MS
                  && Math.abs(hbMs - derivedMs) < KV_CAP_SYNC_MS){
          // #1829: heartbeat_at and derived_at aging together is NOT evidence of a cap -- pusher.py's
          // derived-freshness ping writes both into the same heartbeat_at value in one POST (see
          // this file's own header), so the two always age together by construction once the ping's
          // adaptive pacing widens past RUNNING_SUSPICION_MS on an idle fleet. Demoted (#1712's
          // original "refusing writes" diagnosis here was a false positive) to a neutral line naming
          // the ping cadence; the REAL cap signal is kvWriteCapResetsAt, checked above.
          banner(`<b>No fresh write since ${esc(age(snap.heartbeat_at))} ago.</b> The derived-freshness ping's cadence has widened (idle fleet) — this is expected, not necessarily a cap. Data below is from the last push.`);
        } else if(running && isFinite(derivedMs) && derivedMs > RUNNING_SUSPICION_MS){
          banner(`<b>Snapshot derivation may be stuck.</b> The pusher is alive (heartbeat ${esc(age(snap.heartbeat_at))} ago) but its last successful derivation was ${esc(age(snap.derived_at))} ago while rooms show Running — derive_snapshot_and_timelines may be failing every cycle.`);
        } else {
          banner("");
        }
        render(snap.rooms, snap.pushed_at, snap.underhood, snap.heartbeat_at, accumulatedTimelines, snap.stale_hidden_count, dismissedRooms, snap.conductor, snap.derived_at);
        // #1391: independent of the board render above -- vendors[] is fleet-wide, not per-room.
        vendorUsageHtml(snap.vendors);
      } else if(snap && snap.rooms === null){
        $("content").innerHTML = "";
        $("dismissnote").innerHTML = "";
        banner("<b>No snapshot pushed yet.</b> The mailbox is live but the fleet machine hasn't pushed data.");
        $("fresh").textContent = "empty mailbox";
      }
      return;
    }
    const e = ev.error || {};
    if(e.code === "server_not_connected"){
      if(lastGood){ banner("<b>Feed lost.</b> The baton connector is not reachable — data below is the last snapshot."); }
      else { banner("<b>The baton connector is not connected in this view.</b> Add it once via Settings → Connectors → Add custom (or the connector prompt this page raises), then reload."); $("fresh").textContent = "no feed"; }
    } else if(e.code === "needs_reauth" || e.code === "blocked_by_policy" || e.code === "approval_required"){
      $("content").innerHTML = "";
      banner(`<b>Access denied</b> (${esc(e.code)}). ${esc(e.message || "")}`);
      $("fresh").textContent = "no feed";
    } else if(e.code === "tool_error"){
      banner(`<b>fleet_status reported failure:</b> ${esc(e.message || "")}` + (lastGood ? " — showing last good data." : ""));
    } else {
      if(!lastGood){ banner(`<b>No data yet</b> (${esc(e.code || "unknown")}). ${esc(upstreamErrorDetail(e))}`); }
    }
  }, { refetchInterval: 30000, cache: { staleTime: 25000 } });

  mcp.watchTool("baton", "deliverables_list", {}, (ev) => {
    if(ev.type === "data"){
      let payload = ev.result.payload;
      if(typeof payload === "string"){ try { payload = JSON.parse(payload); } catch { payload = null; } }
      inboxIndex = (payload && Array.isArray(payload.items)) ? payload.items : [];
      if(!location.hash.startsWith("#inbox:")) applyRoute();
      if(lastGood && Array.isArray(lastGood.rooms)){
        render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms, lastGood.conductor);
      }
      return;
    }
    const e = ev.error || {};
    $("inboxbanner").innerHTML = `<div class="banner"><b>Inbox feed unavailable</b> (${esc(e.code || "unknown")}). ${esc(upstreamErrorDetail(e))}</div>`;
  }, { refetchInterval: 30000, cache: { staleTime: 25000 } });

  applyRoute();
})();
</script>
