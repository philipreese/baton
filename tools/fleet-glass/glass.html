<!--
  Fleet Glass — the operator's primary observability surface (Baton Spike 1;
  provenance in worker.js's header). #1505 (glass v2 core, epic #1502) merged the deliverables
  inbox into this same artifact as a second tab -- ONE artifact URL identity now, never two
  bookmarks/connector prompts for one operator (menu item #45). inbox.html is deleted; this file's
  own name is the artifact's filename identity and does not change.

  This is a Claude.ai ARTIFACT, not a plain static page: it declares the `mcp` capability and
  watches the `fleet_status` / `deliverables_list` / `deliverable_read` tools on a custom MCP
  connector named "baton" (Settings -> Connectors -> Add custom -> the Worker's
  /mcp/<READ_SEGMENT> URL from tools/fleet-glass/secrets.local.json). Data flows fleet machine ->
  pusher.py -> Worker (worker.js) -> KV -> this page, on a 30s poll, with the viewer's own
  connector credentials. Read-only: no write verbs execute anywhere in this file -- the two
  clipboard buttons per room COPY a CLI verb string for the operator to paste into their own
  Claude Code mobile session; nothing here calls baton or the engine directly (spec/baton.md §10:
  origination and arrest both stay orchestrator-only from this page).

  role/adapter/model/effort/timeoutMs (engine PR #1504, epic #1502 item #5/#6/#7; #1613 item 3
  carries them through the terminal-sentinel fast path too, when bindings.json names exactly one
  role) are read ABSENT-SAFE throughout: every reference below is behind a truthiness/null check,
  so this page renders identically whether or not the producing pusher/engine has been redeployed
  -- an unredeployed pair simply never sets these fields, same as any other optional fleet_status
  field.

  Timeline entries (menu item #1/#2, extended by #1613 item 4) are content-free by construction
  (pusher.py's `extract_timeline` keeps only event type, timestamp, stepId, and exitCode -- ids and
  counts, never stdout, per the operator's 2026-09-01 ruling amending the content-free
  construction) and, since #1613, exist for TERMINAL rooms too (fetched once, cached) -- pre-#1613
  a finished lane showed no Timeline section at all.

  `room.live` (#1613 item 1: toolCalls/lastActivityAt, plus claude-only output/context token counts
  since a 2026-09-01 review finding, for a Running room's currently-executing step) is absent-safe
  the same way -- see `liveTelemetryHtml`'s own comment for the token fields' exact gating.

  `derived_at` (#1613 item 2) is what the "Snapshot derivation may be stuck" banner keys on instead
  of pushed_at, and `pending_push_age_s` (2026-09-01 review finding) is the "Push failing" banner's
  own signal -- see the banner code's own comments below for why pushed_at alone false-fired and why
  derived_at alone cannot see a failing push.

  `pusher.writeBudgetExhaustedUntil` (#1690, absent-safe the same way) is the one final snapshot the
  pusher sends when its daily KV write-budget ledger runs out, and takes priority over every other
  banner below -- spec/baton.md §6, "Fleet Glass write budget".

  `staleness` (#1557 PR-B1, same absent-safe convention) rides in only on a cycle where the pusher
  is running with `FLEET_GLASS_PROJECTION_SOURCE=file` and found the daemon's own projection file
  stale or absent, falling back to its own derivation for that cycle -- checked right after the
  write-budget banner above (both are the pusher explaining a self-diagnosed source problem, not a
  KV/heartbeat symptom).
-->

.board-card-title{font:500 .82rem 'Public Sans'; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;}

.section-heading{font:600 .7rem 'Public Sans'; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:.6rem 0 .2rem;}
.stdout-asof{text-transform:none; letter-spacing:normal; font-weight:400;}

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function age(iso){
  if(!iso) return null;
  const ms = Date.now() - Date.parse(iso);
  if(!isFinite(ms) || ms < 0) return null;
  const m = Math.floor(ms/60000);
  if(m < 1) return "just now";
  if(m < 60) return m + "m";
  const h = Math.floor(m/60);
  if(h < 48) return h + "h";
  return Math.floor(h/24) + "d";
}
// #1656: the connector's own error object for a failed tool call (e.g. `code: "upstream_error"`,
// measured 2026-09-02 against a 160,539-byte deliverables_list body) carries no message beyond a
// generic "request failed" -- useless for telling "the worker 500'd" apart from "the response was
// too big for this view to swallow". When the connector DOES attach more (field names are
// best-effort across connector versions -- `status`/`httpStatus` and `responseSize`/`size`/
// `bytes`), surface those instead of the generic text; degrade to `e.message`, then the bare code,
// only when neither is present.
function upstreamErrorDetail(e){
  if(e.code !== "upstream_error") return e.message || "";
  const status = e.status ?? e.httpStatus ?? e.statusCode;
  const size = e.responseSize ?? e.size ?? e.bytes ?? e.contentLength;
  const bits = [];
  if(status != null) bits.push(`HTTP ${status}`);
  if(size != null) bits.push(`${size} bytes`);
  if(bits.length) return `upstream returned ${bits.join(", ")}`;
  return e.message || "upstream request failed (no further detail from the connector)";
}
function dur(msVal){
  if(msVal == null) return null;
  const m = Math.round(msVal/60000);
  return m < 1 ? Math.round(msVal/1000) + "s" : m + "m";
}
// #1591: spec/baton.md §3's summation rules -- on claude, cacheReadTokens/cacheCreationTokens are
// true siblings of tokensIn/tokensOut (never subsets), so the honest burn sum adds all four; on agy,
// cacheCreationTokens is never observed (stays absent, so it contributes 0 either way here) and
// summing tokensIn+tokensOut+cacheReadTokens is the documented lower bound. thinkingTokens is never
// added on either vendor -- a breakdown of tokensOut on claude, unmeasured containment on agy.
function tokens(u){
  if(!u || u.tokensIn == null) return null;
  const t = (u.tokensIn + (u.tokensOut||0) + (u.cacheReadTokens||0) + (u.cacheCreationTokens||0))/1000;
  return Math.round(t) + "k tok";
}
// #1678: fine-grained wall-clock for a terminal/needs-you card's telemetry line ("8m50s"/"45s") --
// distinct from dur()'s coarse "8m" rounding, which loses the seconds a finished lane's card is
// meant to show at a glance.
function durFine(msVal){
  if(msVal == null) return null;
  const totalSec = Math.max(0, Math.round(msVal/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec % 60;
  return m > 0 ? `${m}m${s}s` : `${s}s`;
}
// #1613 review (live tokens): compact "12.4k"/"68k" formatting for room.live's outputTokens/
// contextTokens -- one decimal place below 10k for readability, whole numbers at or above it
// (matches how large the raw counts actually get), plain digits under 1k.
function fmtK(n){
  if(!(typeof n === "number") || !isFinite(n)) return String(n);
  if(n < 1000) return String(n);
  const k = n/1000;
  const rounded = k >= 10 ? Math.round(k) : Math.round(k*10)/10;
  return rounded + "k";
}
function newestStepTime(room){
  let newest = null;
  for(const s of room.steps || []){
    if(s.timestamp && (!newest || s.timestamp > newest)) newest = s.timestamp;
  }
  return newest;
}

// -----------------------------------------------------------------------------------------------
// #1618: project workspace sub-line (the room's projectRoot, emitted by FleetStatusTool.cs:458-460).
// Displays the tail (last one or two segments, e.g. repos\w1614) with full path in title tooltip.
// Absent-safe: rooms with no project render nothing.
// -----------------------------------------------------------------------------------------------
function projectTail(path){
  if(!path || typeof path !== "string") return "";
  const cleaned = path.trim().replace(/[\\/]+$/, "");
  if(!cleaned) return "";
  const sep = cleaned.includes("\\") && !cleaned.includes("/") ? "\\" : "/";
  const parts = cleaned.split(/[\\/]+/).filter(Boolean);
  if(!parts.length) return "";
  return parts.slice(-2).join(sep);
}
function projectLineHtml(room){
  if(!room || !room.project) return "";
  const tail = projectTail(room.project);
  if(!tail) return "";
  return `<div class="project" title="${esc(room.project)}">${esc(tail)}</div>`;
}

// -----------------------------------------------------------------------------------------------
// #1441/#1620: redispatch lineage read off .baton/room.json (spec/baton.md §6 schema) --
// parentRoomPath/parentExecutionId are fixed at redispatch time, so "supersedes" is a straight
// lookup and "superseded by" is a reverse scan of roomsByPath for a child naming this room as
// parent. Both stay absent-safe: an ordinary dispatch room has neither field, and a parent that has
// since aged off the fleet snapshot (retention swept, or simply outside include_terminal) still
// names itself by its own trailing path segments (projectTail) rather than rendering nothing.
// -----------------------------------------------------------------------------------------------
function lineageLineHtml(room, roomsByPath){
  if(!room) return "";
  const byPath = roomsByPath instanceof Map ? roomsByPath : new Map();
  const bits = [];
  if(room.parentRoomPath){
    const parent = byPath.get(room.parentRoomPath);
    const parentName = parent ? (parent.label || parent.name) : (projectTail(room.parentRoomPath) || room.parentRoomPath);
    bits.push(`supersedes ${esc(parentName)}`);
  }
  if(room.path){
    for(const child of byPath.values()){
      if(child && child.parentRoomPath === room.path){
        bits.push(`superseded by ${esc(child.label || child.name)}`);
      }
    }
  }
  return bits.length ? `<div class="lineage">${bits.join(" · ")}</div>` : "";
}

// -----------------------------------------------------------------------------------------------
// #1505 item 1: binding fields (role/adapter/model/effort, engine PR #1504) + client-derived
// timebox remaining (timeoutMs - (now - the Running step's own timestamp), both absent-safe).
// -----------------------------------------------------------------------------------------------
function bindingLineHtml(room){
  const bits = [];
  if(room.role) bits.push(esc(room.role));
  if(room.adapter) bits.push(esc(room.adapter));
  if(room.model) bits.push(esc(room.model));
  if(room.effort) bits.push(esc(room.effort));
  return bits.length ? `<div class="ev mono">${bits.join(" · ")}</div>` : "";
}
function timeboxChip(room, running){
  if(!running || room.timeoutMs == null || !running.timestamp) return null;
  const elapsedMs = Date.now() - Date.parse(running.timestamp);
  if(!isFinite(elapsedMs)) return null;
  const remainingMs = room.timeoutMs - elapsedMs;
  const mins = Math.round(Math.abs(remainingMs)/60000);
  return remainingMs >= 0 ? [`⏳ ${mins}m left`, "c-idle"] : [`overdue ${mins}m`, "c-bad"];
}

// -----------------------------------------------------------------------------------------------
// #1505 item 2: honest failure rendering. `try` is corrected-invocation text (a pre-ledger
// refusal's suggested command, spec/baton.md §3), NOT a retry-attempt counter -- the epic
// brainstorm's "try counter" framing does not match what FleetStatusTool actually emits, and this
// page does not pretend otherwise (see report-1505.md for the full finding). `liveness: "dead"`
// becomes an explicit ZOMBIE chip instead of inline text.
// #1509/#1510/#1522: `attempt`/`maxAttempts` (WorkflowStatusStepView, lifetime execution-count derived)
// and `failureKind`/`retryEligible` (the engine's own FailureClassification enum member name and
// RetryEngine.MayRetry's verdict) now do reach the payload per-step -- see FleetStatusTool.cs.
// Both stay presence-gated the same way liveness/try already are: a step that hasn't executed
// renders no attempt chip, a step that never failed renders no failure-kind chip.
// #1522 review finding 3: `attempt` (lifetime execution ordinal) and `maxAttempts` (the per-round
// retry budget, ConsecutiveFailureCount basis) do not share a denominator -- RetryWithRevision can
// push `attempt` past `maxAttempts` (e.g. attempt 4 against a MaxAttempts of 3), and an
// ExhaustedUntil outcome increments `attempt` while spending no retry budget. The chip renders
// `attempt` alone; it never builds an "N/M" ratio from the two.
// -----------------------------------------------------------------------------------------------
function attemptChip(step){
  if(!step || step.attempt == null) return null;
  return [`attempt ${step.attempt}`, "c-idle"];
}
function failureKindChip(step){
  if(!step || !step.failureKind) return null;
  const cls = step.retryEligible === true ? "c-warn" : step.retryEligible === false ? "c-bad" : "c-idle";
  return [step.failureKind.toUpperCase(), cls];
}
// #1702: `step.verify === "not-run"` (WorkflowStatusStepView.Verify) is the pre-flight "not runnable"
// outcome -- the step still ran and Succeeded, but the engine's own verify step never confirmed it.
// Presence-gated the same convention as failureKindChip above; chipsHtml's [label,cls] tuple shape
// has no room for the reason text (`step.verifyReason`), same as every other chip here -- a caller
// wanting the reason reads fleet_status/status --json directly.
function unverifiedChip(step){
  if(!step || step.verify !== "not-run") return null;
  return ["UNVERIFIED", "c-warn"];
}
// -----------------------------------------------------------------------------------------------
// #1551: `step.exhaustedUntil` is the vendor-quota park's own reset instant (WorkflowStatusStepView,
// gated to an actual ExhaustedUntil park with a recorded obligation -- absent for an un-obligated
// park or an ordinary Retryable backoff, same presence-gated convention as failureKindChip above).
// Absolute + relative, mirroring timeboxChip's future/overdue duality above it -- but a Failed step
// whose OWN liveness reads "dead" (#1513) has no scheduler left to fire this at all: a live
// countdown there would be dishonest, so that arm renders the same past instant as a flat fact
// instead -- and per #1598 review F1, a bare clock time ("was due 21:59") can't tell tonight from
// three days ago, so the dead arm renders the relative span instead ("was due 3d ago — no
// scheduler"), never a fake countdown. `parkLadder` below is a local m→h→d ladder (deliberately not
// `age()`: that one returns null for negative spans and floors "just now", neither of which fits a
// duration that can be future OR past) -- and it's what keeps a far-future (#1183-shaped) instant
// rendering as "2914d" rather than a multi-million-minute count. When the target instant falls on a
// different calendar day than now, the clock parenthetical gets the date prefixed (StatusCommand.cs
// FormatParkedStatus's rationale: parks span days, a bare clock time is ambiguous -- the chip must
// not reintroduce the ambiguity the human path already removed). `Date.parse`/`toLocaleTimeString`
// do not throw on a far-future instant -- `isFinite` below is what a genuinely unparseable one falls
// back through, same as `age()`/`timeboxChip`.
// -----------------------------------------------------------------------------------------------
function parkLadder(ms){
  const m = Math.floor(ms/60000);
  if(m < 60) return m + "m";
  const h = Math.floor(m/60);
  if(h < 48) return h + "h";
  return Math.floor(h/24) + "d";
}
function parkChip(step){
  if(!step || !step.exhaustedUntil) return null;
  const target = Date.parse(step.exhaustedUntil);
  if(!isFinite(target)) return null;
  const targetDate = new Date(target);
  const now = new Date();
  const crossesDay = targetDate.toDateString() !== now.toDateString();
  const clock = (crossesDay ? targetDate.toLocaleDateString([], {month: "short", day: "numeric"}) + " " : "")
    + targetDate.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  const diffMs = target - Date.now();
  const rel = parkLadder(Math.abs(diffMs));
  if(step.liveness === "dead"){
    return [`was due ${rel} ago — no scheduler`, "c-warn"];
  }
  return diffMs >= 0
    ? [`resumes in ${rel} (${clock})`, "c-idle"]
    : [`overdue ${rel} (${clock})`, "c-bad"];
}
// #1678: pulled out of chipsHtml so a compact board card can show the same single primary chip
// without pulling in the timebox/attempt/failure/park chips a card has no room for.
function primaryStateChip(room){
  const st = room.state;
  return st === "Running" ? ["RUNNING","c-run"]
    : st === "Failed" && room.rejected ? ["REJECTED","c-warn"]
    // #1622 (d): `rejected` narrowed to `baton resolve --reject` only, so a room a conductor
    // settled with `--close` arrives Failed with `rejected` false and only `resolvedBy` set.
    // Without this arm it would render as a bare FAILED -- an unexplained crash, when in fact a
    // person looked at it and closed it. `resolvedBy` is the fleet view's field for exactly that
    // (spec/baton.md §6's room schema).
    : st === "Failed" && room.resolvedBy ? ["CLOSED","c-warn"]
    : st === "Succeeded" ? ["SUCCEEDED","c-ok"]
    : st === "Failed" ? ["FAILED","c-bad"]
    // #1582: Stalled means a scheduled retry with no scheduler left to fire it -- nothing moves
    // it without a person, so it gets the "needs you" colour, never the idle grey the generic
    // fallback below would give an unrecognized state.
    : st === "Stalled" ? ["STALLED","c-warn"]
    // #1698: Cancelled is over and nobody needs to act -- idle grey, never the "needs you" amber.
    : st === "Cancelled" ? ["CANCELLED","c-idle"]
    // #1586 S1: Indeterminate means journal facts alone could not decide success vs failure -- a
    // conductor has to look, same "needs you" colour as Stalled, distinct label. Producer since
    // #1608 (WorkflowOutcome.Indeterminate's own remarks) -- baton resolve is the way out.
    : st === "Indeterminate" ? ["INDETERMINATE","c-warn"]
    : st ? [st.toUpperCase(),"c-idle"] : ["UNREADABLE","c-warn"];
}
function chipsHtml(room, running, focusStep){
  const chips = [];
  chips.push(primaryStateChip(room));
  if(running && running.liveness === "dead") chips.push(["ZOMBIE","c-bad"]);
  const tb = timeboxChip(room, running);
  if(tb) chips.push(tb);
  const ac = attemptChip(focusStep);
  if(ac) chips.push(ac);
  const fc = failureKindChip(focusStep);
  if(fc) chips.push(fc);
  const pc = parkChip(focusStep);
  if(pc) chips.push(pc);
  const uc = unverifiedChip(focusStep);
  if(uc) chips.push(uc);
  // #1155: pusher.py's `pruned` field -- see spec/baton.md §6 for the shape/rationale. Idle
  // grey, informational only, no restore verb here.
  if(room.pruned && room.pruned.count) chips.push([`${room.pruned.count} PRUNED`,"c-idle"]);
  return chips.map(([label,cls]) => `<span class="chip ${cls}">${esc(label)}</span>`).join("");
}

// -----------------------------------------------------------------------------------------------
// #1505 item 3 & #1536: per-room event timeline, content-free (pusher.py's extract_timeline keeps
// only type+timestamp), keyed by room PATH (never name -- fleet_status dedupes by path, and a
// name-keyed join could hand one room's timeline to a differently-rooted same-named room).
// #1536 item 1: timelines are persisted across page refreshes in localStorage (try/catch-wrapped,
// capped at 100 entries per room, absent rooms dropped).
// #1536 item 2: raw event types map to friendly legible names with raw types in title tooltips.
// -----------------------------------------------------------------------------------------------
const TIMELINE_STORAGE_KEY = "baton.glass.timelines";
const TIMELINE_ROOM_CAP = 100;

const EVENT_NAMES = {
  // Flow events (FlowEvent.cs)
  "flow.executionRequestAccepted": "worker accepted",
  "executionRequestAccepted": "worker accepted",
  "flow.executionRequestRejected": "worker rejected",
  "executionRequestRejected": "worker rejected",
  "flow.executionSucceeded": "execution succeeded",

  "executionCancelled": "execution cancelled",
  "flow.cancellationRequested": "cancellation requested",
  "cancellationRequested": "cancellation requested",
  "flow.workflowPaused": "workflow paused",
  "workflowPaused": "workflow paused",
  "flow.externalDecisionRecorded": "decision recorded",
  "externalDecisionRecorded": "decision recorded",
  "flow.workflowResumed": "workflow resumed",
  "workflowResumed": "workflow resumed",
  "flow.stepRetryScheduled": "retry scheduled",
  "stepRetryScheduled": "retry scheduled",
  "flow.executionIndeterminate": "execution indeterminate",
  "executionIndeterminate": "execution indeterminate",
  "flow.captureResolved": "capture resolved",
  "captureResolved": "capture resolved",
  "flow.verifyStarted": "verify started",
  "verifyStarted": "verify started",
  "flow.verifyPassed": "verify passed",
  "verifyPassed": "verify passed",
  "flow.verifyFailed": "verify failed",
  "verifyFailed": "verify failed",
  "flow.verifyNotRun": "verify not run",
  "verifyNotRun": "verify not run",

  "verifyDeclarationIgnored": "verify declaration ignored",

  "verifyDeclarationUnreviewed": "verify declaration unreviewed",
  "flow.executionArrested": "execution arrested",
  "executionArrested": "execution arrested",

  // Core events (CoreEvent.cs)
  "core.executionStarted": "execution started",
  "executionStarted": "execution started",
  "core.executionExited": "execution exited",
  "executionExited": "execution exited",

  // Room events (RoomEvent.cs)
  "room.heldWorkDispatched": "held work dispatched",
  "heldWorkDispatched": "held work dispatched",
  "room.heldWorkEscalated": "held work escalated",
  "heldWorkEscalated": "held work escalated",
  "room.heldWorkResolved": "held work resolved",
  "heldWorkResolved": "held work resolved",
  "room.grantRecorded": "grant recorded",
  "grantRecorded": "grant recorded",
  "room.grantAmended": "grant amended",
  "grantAmended": "grant amended",

  "grantRevoked": "grant revoked",

  "escalationRaised": "escalation raised",
  "room.turnHostDormancyEntered": "dormancy entered",
  "turnHostDormancyEntered": "dormancy entered",
  "room.turnHostDormancyCleared": "dormancy cleared",
  "turnHostDormancyCleared": "dormancy cleared",
  "room.runtimePermissionAsked": "permission asked",
  "runtimePermissionAsked": "permission asked",
  "room.runtimePermissionAnswered": "permission answered",
  "runtimePermissionAnswered": "permission answered",
  "room.runtimePermissionRevoked": "permission revoked",
  "runtimePermissionRevoked": "permission revoked",
  "room.workflowSwitched": "workflow switched",
  "workflowSwitched": "workflow switched",
  "room.standingPermissionRevoked": "standing permission revoked",
  "standingPermissionRevoked": "standing permission revoked",
  "room.workerJoined": "worker joined",
  "workerJoined": "worker joined",
  "room.workerRenamed": "worker renamed",
  "workerRenamed": "worker renamed",
  "room.orchestratorAssigned": "orchestrator assigned",
  "orchestratorAssigned": "orchestrator assigned",

  // Special / synthetic
  "unreadable": "unreadable",
  "unknown": "unknown",
};

function friendlyEventName(rawType){
  if(!rawType) return "";
  if(EVENT_NAMES[rawType]) return EVENT_NAMES[rawType];
  const unprefixed = String(rawType).replace(/^(flow|core|room)\./, "");
  if(EVENT_NAMES[unprefixed]) return EVENT_NAMES[unprefixed];
  return String(rawType);
}

function loadPersistedTimelines(){
  try {
    if(typeof localStorage === "undefined" || !localStorage) return {};
    const raw = localStorage.getItem(TIMELINE_STORAGE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {};
  } catch(e) {
    return {};
  }
}

function savePersistedTimelines(timelines){
  try {
    if(typeof localStorage === "undefined" || !localStorage) return;
    if(!timelines || typeof timelines !== "object") return;
    localStorage.setItem(TIMELINE_STORAGE_KEY, JSON.stringify(timelines));
  } catch(e) {
    // Storage access blocked or quota exceeded
  }
}

function entryKey(e){
  if(!e || typeof e !== "object") return "";
  return `${e.type ?? ""}__${e.timestamp ?? ""}`;
}

function mergeTimelineEntries(existing, incoming, cap = TIMELINE_ROOM_CAP){
  const res = Array.isArray(existing) ? existing.slice() : [];
  if(!Array.isArray(incoming) || !incoming.length){
    return res.length > cap ? res.slice(-cap) : res;
  }
  const seen = new Set(res.map(entryKey));
  for(const e of incoming){
    if(!e || typeof e !== "object") continue;
    const key = entryKey(e);
    if(!seen.has(key)){
      seen.add(key);
      res.push(e);
    }
  }
  return res.length > cap ? res.slice(-cap) : res;
}

function updateAccumulatedTimelines(existingTimelines, rooms, incomingTimelines){
  const result = {};
  if(!Array.isArray(rooms)) return result;
  const existing = (existingTimelines && typeof existingTimelines === "object") ? existingTimelines : {};
  const incoming = (incomingTimelines && typeof incomingTimelines === "object") ? incomingTimelines : {};

  for(const room of rooms){
    if(!room || !room.path) continue;
    const path = room.path;
    const prev = existing[path] || [];
    const inc = incoming[path] || [];
    const merged = mergeTimelineEntries(prev, inc, TIMELINE_ROOM_CAP);
    if(merged.length > 0){
      result[path] = merged;
    }
  }
  return result;
}

// #1613 item 4: stepId/exitCode ride each entry (ids/counts, per the operator's amended content
// ruling) when the underlying event carried one -- absent-safe, same as every other optional field
// on this page: an entry with neither renders exactly as it did pre-#1613.
function timelineEntryDetail(e){
  const bits = [];
  if(e.stepId) bits.push(esc(e.stepId));
  if(e.exitCode != null) bits.push(`exit ${esc(String(e.exitCode))}`);
  return bits.length ? ` (${bits.join(", ")})` : "";
}
// #1793: consecutive `executionProgress` rows (the 5-minute run-liveness heartbeat,
// Baton.Cli.ExecutionProgressHeartbeat / FlowEvent.ExecutionProgress) carry no information beyond
// "still alive" -- a run of them with no OTHER event in between collapses into one summary row. Any
// other event breaks the run, so a heartbeat immediately before/after something informative (started,
// exited, review started) still shows that neighbor on its own line. Pure client-side grouping over
// the same entries array -- no projection change, and a lone (non-consecutive) heartbeat still
// renders as an ordinary row rather than "1 heartbeats".
function isHeartbeatEntry(e){
  const rawType = e && e.type || "";
  return rawType === "executionProgress" || rawType === "flow.executionProgress";
}
function collapseHeartbeatRuns(entries){
  const groups = [];
  for(const e of entries){
    const last = groups[groups.length - 1];
    if(isHeartbeatEntry(e) && last && last.heartbeat){
      last.entries.push(e);
      continue;
    }
    groups.push({heartbeat: isHeartbeatEntry(e), entries: [e]});
  }
  return groups;
}
function clockLabel(iso){
  const ms = iso ? Date.parse(iso) : NaN;
  return isFinite(ms) ? new Date(ms).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
}
function heartbeatRunHtml(group){
  const first = clockLabel(group.entries[0].timestamp);
  const last = clockLabel(group.entries[group.entries.length - 1].timestamp);
  const span = (first && last) ? ` · ${first} → ${last}` : "";
  return `<div class="tl-entry"><span class="tl-type mono">alive · ${group.entries.length} heartbeats${span}</span></div>`;
}
function timelineHtml(room, timelines, isOpen = false){
  const entries = timelines && room.path ? timelines[room.path] : null;
  if(!Array.isArray(entries) || !entries.length) return "";
  const rows = collapseHeartbeatRuns(entries).map(group => {
    if(group.heartbeat && group.entries.length > 1) return heartbeatRunHtml(group);
    const e = group.entries[0];
    const a = age(e.timestamp);
    const rawType = e.type || "";
    const label = friendlyEventName(rawType);
    return `<div class="tl-entry"><span class="tl-type mono" title="${esc(rawType)}">${esc(label)}${timelineEntryDetail(e)}</span><span class="tl-age">${a ? a + " ago" : ""}</span></div>`;
  }).join("");
  return `<details class="tl-details" data-room-path="${esc(room.path)}"${isOpen ? " open" : ""}><summary>Timeline · ${entries.length}</summary>${rows}</details>`;
}

// -----------------------------------------------------------------------------------------------
// #1532: per-viewer dismiss and terminal collapse. Persisted in localStorage under its own key
// (baton.glass.dismissed), keyed by room PATH (absent-safe, try/catch-wrapped).
// Never silent: dismissed count + state is visible with a restore affordance.
// -----------------------------------------------------------------------------------------------
const DISMISSED_STORAGE_KEY = "baton.glass.dismissed";

function loadPersistedDismissed(){
  try {
    if(typeof localStorage === "undefined" || !localStorage) return new Set();
    const raw = localStorage.getItem(DISMISSED_STORAGE_KEY);
    if(!raw) return new Set();
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? new Set(parsed.filter(p => typeof p === "string" && p)) : new Set();
  } catch(e) {
    return new Set();
  }
}

function savePersistedDismissed(dismissedSet){
  try {
    if(typeof localStorage === "undefined" || !localStorage) return;
    if(!dismissedSet) return;
    const arr = Array.from(dismissedSet);
    localStorage.setItem(DISMISSED_STORAGE_KEY, JSON.stringify(arr));
  } catch(e) {
    // Storage access blocked or quota exceeded
  }
}

function pruneDismissed(dismissedSet, rooms){
  if(!dismissedSet) return new Set();
  const current = dismissedSet instanceof Set ? new Set(dismissedSet) : new Set(Array.isArray(dismissedSet) ? dismissedSet : []);
  if(!Array.isArray(rooms)) return current;
  const presentTerminalPaths = new Set();
  for(const r of rooms){
    if(r && r.path){
      if(r.state === "Running"){
        current.delete(r.path);
      } else {
        presentTerminalPaths.add(r.path);
      }
    }
  }
  for(const p of Array.from(current)){
    if(!presentTerminalPaths.has(p)){
      current.delete(p);
    }
  }
  return current;
}

// -----------------------------------------------------------------------------------------------
// #1505 item 6: copy-the-verb. Never executes anything -- copies a CLI verb string to the
// clipboard for the operator to paste into their own Claude Code mobile session (spec/baton.md
// §10: origination and arrest both stay orchestrator-only). `redispatch` needs only the room
// path; `cancel`'s actual parser (CancelOptionsParser.cs) hard-requires --execution and
// --bindings, so the copied command only appears once a Running step's execution id is known,
// and always carries the full working invocation rather than a bare path that would fail if
// pasted verbatim -- see report-1505.md's labeled deviation note.
// -----------------------------------------------------------------------------------------------
function bindingsPathFor(roomPath){
  const sep = roomPath.includes("\\") && !roomPath.includes("/") ? "\\" : "/";
  return roomPath.replace(/[\\/]+$/, "") + sep + "bindings.json";
}
// The verb is copied to a clipboard and pasted into a real shell, so a `"` in a room path would
// otherwise terminate the quoted argument early and let anything after it execute (PR #1508 review).
// Escaping the quote-closer neutralizes that for both bash and pwsh double-quoted arguments; if a
// path still carries a raw newline (no legal filesystem produces one, but the payload isn't
// path-validated), refuse the button rather than emit a command that could span lines.
function shellArgSafe(s){ return !/[\r\n]/.test(s); }
function shq(s){ return s.replace(/"/g, '\\"'); }
function copyButtonHtml(verb, label){
  return `<button class="copybtn" data-verb="${esc(verb)}">${esc(label)}</button><input class="revealbox mono" readonly hidden>`;
}
// #1659: `baton room delete` copy button, terminal cards only -- a room still Running/Stalled may
// have a live engine holding its files (RoomDeleteCommand's own refusal exists for exactly that), so
// this is offered only where `terminal` is true (Failed/Succeeded/Indeterminate, the states a room's
// terminal.json is actually written for). Dry-run-free (no --force) on purpose: a terminal card is
// already known terminal from the same fleet_status read this page renders from, so the default
// refusal `baton room delete` would hit on a non-terminal room never applies here.
function copyButtonsHtml(room, running, terminal){
  if(!room.path || !shellArgSafe(room.path)) return "";
  const buttons = [copyButtonHtml(`baton redispatch "${shq(room.path)}"`, "copy redispatch")];
  if(room.state === "Running" && running && running.execution){
    const cancelVerb = `baton cancel "${shq(room.path)}" --execution ${running.execution} --bindings "${shq(bindingsPathFor(room.path))}"`;
    buttons.push(copyButtonHtml(cancelVerb, "copy cancel"));
  }
  if(terminal){
    buttons.push(copyButtonHtml(`baton room delete "${shq(room.path)}"`, "copy delete"));
  }
  return `<div class="verbs">${buttons.join("")}</div>`;
}
async function copyToClipboard(text){
  try {
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e) { /* fall through to the execCommand fallback */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e) {
    return false;
  }
}
document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest(".copybtn");
  if(!btn) return;
  // #1659: the Terminal section's "copy prune" button lives inside <summary> (so it reads as part of
  // the section header) -- without this, a click on it would ALSO fire the native <summary> toggle
  // and collapse/expand the section the operator was not trying to touch.
  ev.preventDefault();
  const verb = btn.dataset.verb;
  const ok = await copyToClipboard(verb);
  const reveal = btn.nextElementSibling;
  if(ok){
    const orig = btn.textContent;
    btn.textContent = "copied";
    setTimeout(() => { btn.textContent = orig; }, 1500);
    if(reveal) reveal.hidden = true;
  } else if(reveal){
    // Sandboxed artifact contexts can deny both clipboard paths -- degrade to a tap-to-reveal,
    // select-all text field rather than silently doing nothing.
    reveal.hidden = false;
    reveal.value = verb;
    reveal.focus(); reveal.select();
  }
});

// -----------------------------------------------------------------------------------------------
// #1613 item 1: live telemetry for a Running room's currently-executing step -- a tool-call COUNT,
// billed-token/turn counts for ALL THREE vendors (#1682 -- widened from claude-only after a live
// capture found agy's DONE/agent_response step_update also carries usage; #1886 added codex),
// context-level tokens (2026-09-01 review; codex carries them too since #1886, agy does not), and a
// last-stream-activity age, all read pusher-side straight off the
// execution's own .stdout.log (no engine change; see pusher.py's own "Seam choice" comment).
// Absent-safe like role/adapter/model/effort above: `room.live` is simply never present until the
// pusher that produced this snapshot has been redeployed for #1613, same convention every other
// optional fleet_status field on this page already follows -- and #1886 made `toolCalls` obey it
// too, so an absent count now means "unknown shape" where a rendered `0 calls` means a real measured
// zero. Which fields are present per vendor: spec/baton.md §6's `rooms[].live` entry.
// -----------------------------------------------------------------------------------------------
function liveTelemetryBits(live){
  if(!live) return [];
  const bits = [];
  // #1706: on claude the billed figure is a LOWER BOUND -- the vendor's mid-stream usage carries no
  // real input or output count anywhere, so what is shown is cache-creation alone and the real spend
  // is at least this, by a room-dependent factor with no constant to scale by (spec/baton.md §3 has
  // the swept range), which is why this marks the figure instead of correcting it. The "+" is the
  // whole marker on a compact card; pusher.py's `billedIsFloor` is where it comes from.
  if(live.billedTokens != null) bits.push(`billed ${fmtK(live.billedTokens)}${live.billedIsFloor ? "+" : ""}`);
  if(live.contextTokens != null) bits.push(`ctx ${fmtK(live.contextTokens)}`);
  if(live.turns != null) bits.push(`${live.turns} turn${live.turns === 1 ? "" : "s"}`);
  if(live.toolCalls != null) bits.push(`${live.toolCalls} call${live.toolCalls === 1 ? "" : "s"}`);
  const a = age(live.lastActivityAt);
  if(a) bits.push(`active ${a} ago`);
  return bits;
}
function liveTelemetryHtml(room){
  const bits = liveTelemetryBits(room.live);
  return bits.length ? `<div class="ev mono">${bits.join(" · ")}</div>` : "";
}
// #1678: the ruling's one-telemetry-line-per-card requirement, terminal/needs-you rooms included
// (pre-#1678 only Running cards carried a telemetry line at all). Reads final usage off the last
// step's own `usage`/`linkedFromUsage` (WorkflowStatusStepView, spec/baton.md §3) -- the same figures
// the detail pane's full per-step breakdown below reads, just the tail summary a compact card has
// room for. Never fabricates a number: an absent usage object renders the literal "—" the ruling
// calls for, not a blank line that could be mistaken for zero.
function cardTelemetryText(room){
  if(room.state === "Running"){
    const bits = liveTelemetryBits(room.live);
    return bits.length ? bits.join(" · ") : "—";
  }
  const steps = room.steps || [];
  const lastStep = steps[steps.length - 1];
  const u = lastStep && (lastStep.usage || lastStep.linkedFromUsage);
  if(!u) return "—";
  const bits = [];
  if(u.tokensOut != null) bits.push(`out ${fmtK(u.tokensOut)}`);
  if(u.turns != null) bits.push(`${u.turns} turn${u.turns === 1 ? "" : "s"}`);
  const wc = durFine(u.wallClockMs);
  if(wc) bits.push(wc);
  return bits.length ? bits.join(" · ") : "—";
}
// Detail pane's full telemetry section: every step that carries a usage figure, not just the last.
function stepUsageLine(step){
  const u = step.usage || step.linkedFromUsage;
  if(!u) return null;
  const bits = [];
  if(u.tokensOut != null) bits.push(`out ${fmtK(u.tokensOut)}`);
  if(u.turns != null) bits.push(`${u.turns} turn${u.turns === 1 ? "" : "s"}`);
  const wc = durFine(u.wallClockMs);
  if(wc) bits.push(wc);
  const tk = tokens(u);
  if(tk) bits.push(tk);
  return bits.length ? `<div class="ev mono">${esc(step.id)}: ${bits.join(" · ")}</div>` : null;
}
// #1710: a bounded stdout tail for a Running room's detail pane, riding `room.live.stdoutTail`
// (pusher.py's own `stdout_tail_for_room`) -- absent-safe like every other `live` field, so this
// renders nothing on a terminal room, a Running room whose pusher predates #1710, or one with no
// captured stdout yet. `derivedAt` (the snapshot's OWN `derived_at`, spec/baton.md §6) is what "as
// of <age>" reads -- the tail is only ever as fresh as the pusher's last successful derivation, not
// `Date.now()` at render time.
function stdoutTailHtml(room, derivedAt){
  const tail = room.state === "Running" && room.live && typeof room.live.stdoutTail === "string"
    ? room.live.stdoutTail : null;
  if(!tail) return "";
  const asOfAge = age(derivedAt);
  const asOf = asOfAge ? `<span class="stdout-asof">as of ${esc(asOfAge)} ago</span>` : "";
  // #1723: stdoutTail is pre-rendered prose (stream-json lines summarized, blobs elided) by the
  // pusher, not the worker's raw stdout -- this hint is why a reader won't find every field here.
  const hint = `<span class="stdout-asof" title="stream-json lines are rendered as prose and long base64/blob tokens are elided -- this is not raw stdout">rendered</span>`;
  return `<div class="section-heading">stdout ${hint} ${asOf}</div>
    <div class="stdout-tail mono">${esc(tail)}</div>
    <div class="verbs">${copyButtonHtml(tail, "copy stdout")}</div>`;
}
// #1793: `live.doingNow` -- one plain-words line saying what a Running room's worker is doing right
// now (the last assistant text line, or a tool call's own `description`/name+argument summary --
// StdoutTailRenderer.ComputeDoingNow's own doc comment is the port record). Absent-safe like every
// other `live` field: nothing renders on a terminal room, a Running room whose pusher predates
// #1793, or one with no captured stdout yet.
function doingNowHtml(room){
  const text = room.state === "Running" && room.live && typeof room.live.doingNow === "string"
    ? room.live.doingNow : null;
  return text ? `<div class="doing-now">${esc(text)}</div>` : "";
}
function fullTelemetryHtml(room){
  if(room.state === "Running"){
    return liveTelemetryHtml(room) || `<div class="ev">—</div>`;
  }
  const lines = (room.steps || []).map(stepUsageLine).filter(Boolean);
  return lines.length ? lines.join("") : `<div class="ev">—</div>`;
}
function laneHtml(room, timelines, dismissable = false, openTimelines = null, terminal = false){
  const running = (room.steps||[]).find(s => s.state === "Running");
  const lastStep = (room.steps||[])[ (room.steps||[]).length - 1 ];
  // Chips key off the step that actually failed, not array position: in A->B->C with B
  // Permanent-failed and C still Pending, lastStep is C (carries no attempt/failureKind) and
  // neither chip would render even though B holds the data. Simultaneous Failed steps
  // (parallel branches) pick the first one in definition order -- an accepted heuristic.
  const failedStep = (room.steps||[]).find(s => s.state === "Failed");
  const focusStep = running || failedStep || lastStep;
  const bits = [];
  if(running){
    bits.push("step: " + esc(running.id));
    if(running.liveness === "unknown") bits.push("engine: unknown");
  }
  else if(lastStep) bits.push(esc(lastStep.id) + " " + esc(lastStep.state));
  const u = lastStep && (lastStep.usage || lastStep.linkedFromUsage);
  const tk = tokens(u); if(tk) bits.push(tk);
  const wc = u && dur(u.wallClockMs); if(wc) bits.push(wc);
  const err = room.error ? `<div class="ev" title="${esc(room.error)}">⛔ ${esc(room.error.slice(0,110))}</div>` : "";
  const tryLine = room.try ? `<div class="ev" title="${esc(room.try)}">↻ suggested: ${esc(room.try.slice(0,110))}</div>` : "";
  const t = newestStepTime(room);
  const a = age(t);
  // #1656 / #1549: a healthy lane can run 30+ minutes between journal events (a long tool call),
  // so keying the stale ⚠ on journal-event age alone false-fires on every live lane whose journal
  // just happens to be quiet. `room.live.lastActivityAt` (pusher.py's own .stdout.log mtime probe,
  // present whenever a Running room's execution has captured output) is the honest signal when it
  // exists -- fall back to the journal-event age (`t`) only for a Running room `live` was never
  // attached to (dispatch just started, or the pusher hasn't been redeployed for #1613 item 1 yet).
  const liveActivityAt = room.live && room.live.lastActivityAt;
  const stalenessBasis = liveActivityAt || t;
  const isStale = room.state === "Running" && stalenessBasis && (Date.now() - Date.parse(stalenessBasis)) > 15 * 60000;
  const ageLine = a ? `<div class="age">last event ${a} ago${isStale ? " ⚠" : ""}</div>` : "";
  const roomDeliverablesKey = room.path || room.name;
  const deliverables = roomDeliverablesKey
    ? `<div class="deliverables"><a class="inboxlink" data-room="${esc(roomDeliverablesKey)}">deliverables &rarr;</a></div>` : "";
  // #1499: a --label makes the room title the human-legible name (e.g. "the #1496 env-snapshot
  // lane") instead of its bare dispatch-<role>-<hex8> directory name; the room name never disappears
  // -- it drops to a secondary line so deliverables/redispatch/cancel still show what to paste.
  const title = room.label ? esc(room.label) : esc(room.name);
  const roomIdLine = room.label ? `<div class="roomid">${esc(room.name)}</div>` : "";
  const dismissBtn = (dismissable && room.path)
    ? `<button class="dismissbtn" data-path="${esc(room.path)}" title="Dismiss room" aria-label="Dismiss">×</button>`
    : "";
  const isTlOpen = !!(openTimelines && room.path && openTimelines.has(room.path));
  return `<div class="lane"><div class="top"><span class="name">${title}</span><span class="chips">${chipsHtml(room, running, focusStep)}${dismissBtn}</span></div>
    ${roomIdLine}
    ${projectLineHtml(room)}
    ${bindingLineHtml(room)}
    ${bits.length ? `<div class="ev">${bits.join(" · ")}</div>` : ""}${tryLine}${err}${ageLine}
    ${liveTelemetryHtml(room)}
    ${timelineHtml(room, timelines, isTlOpen)}
    ${copyButtonsHtml(room, running, terminal)}
    ${deliverables}</div>`;
}
function underhoodHtml(list){
  if(!Array.isArray(list) || !list.length) return "";
  const rows = list.map(w => {
    const commitAge = w.last_commit_at ? age(w.last_commit_at) : null;
    const bits = [];
    if(w.branch) bits.push(`<span class="mono">${esc(w.branch)}</span>`);
    if(w.uncommitted) bits.push(esc(w.uncommitted));
    const commit = w.last_commit ? `<div class="ev">last commit: ${esc(w.last_commit)}${commitAge ? ` · ${esc(commitAge)} ago` : ""}</div>` : "";
    return `<div class="lane"><div class="top"><span class="name">${esc(w.name)}</span></div>
      <div class="ev">${bits.join(" · ")}</div>${commit}</div>`;
  }).join("");
  return `<h2>Under the hood · ${list.length}</h2><div class="lanes">` + rows + `</div>`;
}
function conductorRoomPathOf(conductor){
  if(!conductor || !conductor.artifacts_path) return null;
  return conductor.path || conductor.artifacts_path.replace(/[\\/]artifacts[\\/]conductor[\\/]?$/, "");
}
// -----------------------------------------------------------------------------------------------
// #1678 (Combo C+E): the three-column state board + detail pane. A card carries only a label, one
// state chip, and one telemetry line (cardTelemetryText above) -- no verbs, no path, no timeline;
// those move to the detail pane on tap/click (the ruling's own "no verbs on cards"). The conductor
// is pinned first in Needs You (#1681's link + copy-path verb, carried into the pane instead of the
// card body -- the card itself is a plain board-card like any other, keyed "__conductor__").
// -----------------------------------------------------------------------------------------------
const CONDUCTOR_KEY = "__conductor__";
function boardCardHtml(key, label, chip, telemetryText, selected, dismissKey, workstream){

function roomCardHtml(room, selectedKey, dismissable){

  return boardCardHtml(key, title, primaryStateChip(room), cardTelemetryText(room), key === selectedKey,

function conductorCardHtml(conductor, selectedKey){

function boardColumnHtml(title, count, cardsHtml){

    <div class="board-column-body">${cardsHtml || `<div class="empty">none</div>`}</div></div>`;

function conductorDetailHtml(conductor){

    <div class="detail-path mono" title="${esc(conductor.artifacts_path)}">${esc(conductor.artifacts_path)}</div>
    ${countLine}

}
// Full detail: path (tap to expand), role/adapter/model/effort, error, step timeline, full
// telemetry, deliverables link, and the same state-appropriate copy verbs the old per-lane card
// used to carry directly (copyButtonsHtml, unchanged -- read-only, copies only, never executes).
function roomDetailHtml(room, timelines, openTimelinePaths, derivedAt, roomsByPath){
  const running = (room.steps||[]).find(s => s.state === "Running");
  const lastStep = (room.steps||[])[ (room.steps||[]).length - 1 ];

  const focusStep = running || failedStep || lastStep;

  const title = room.label ? esc(room.label) : esc(room.name);

  const isTlOpen = !!(openTimelinePaths && room.path && openTimelinePaths.has(room.path));
  const pathHtml = room.path
    ? `<div class="detail-path mono" title="Tap to expand">${esc(room.path)}</div>` : "";
  const err = room.error ? `<div class="ev" title="${esc(room.error)}">⛔ ${esc(room.error)}</div>` : "";
  const tryLine = room.try ? `<div class="ev" title="${esc(room.try)}">↻ suggested: ${esc(room.try)}</div>` : "";
  const roomDeliverablesKey = room.path || room.name;

    ${roomIdLine}

    ${pathHtml}
    ${bindingLineHtml(room)}
    ${err}${tryLine}
    ${doingNowHtml(room)}
    <div class="section-heading">Telemetry</div>
    ${fullTelemetryHtml(room)}

function detailPaneHtml(selectedKey, roomsByPath, conductor, timelines, openTimelinePaths, backOnclick, derivedAt){
  const backBtn = backOnclick ? `<button class="detail-back-btn" id="board-back">&larr; Back to board</button>` : "";
  if(!selectedKey) return backBtn + `<div class="empty">Select a card.</div>`;
  if(selectedKey === CONDUCTOR_KEY) return backBtn + conductorDetailHtml(conductor);
  const room = roomsByPath.get(selectedKey);
  if(!room) return backBtn + `<div class="empty">That room is no longer in the fleet snapshot.</div>`;
  return backBtn + roomDetailHtml(room, timelines, openTimelinePaths, derivedAt, roomsByPath);
